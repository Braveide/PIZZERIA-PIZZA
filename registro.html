<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Registro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* RESET Y BASE - ESTILO ANIMADO NEOTRANSFORMADO */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #222; 
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('imagenes/fondolog.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            overflow-x: hidden;
            position: relative;
        }

        /* EFECTO DE PIZZAS */
        .pizza-rain {
            position: fixed;
            top: -150px;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 0;
        }

        .pizza-drop {
            position: absolute;
            opacity: 0.85;
            filter: drop-shadow(4px 4px 10px rgba(0,0,0,0.5));
            animation: fall linear forwards;
            will-change: transform;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
        }

        /* CONTENEDOR PRINCIPAL */
        .container { 
            background: white; 
            border: 4px solid #000000; 
            border-radius: 20px; 
            max-width: 450px; 
            width: 100%; 
            padding: clamp(25px, 8vw, 40px); 
            text-align: center; 
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.2); 
            position: relative;
            z-index: 10; 
        }

        .logo-container { 
            width: clamp(70px, 15vw, 110px); 
            height: clamp(70px, 15vw, 110px); 
            margin: 0 auto 20px; 
            display: flex; align-items: center; justify-content: center; 
        }
        .logo-container img { width: 100%; height: 100%; object-fit: contain; }

        h1 { font-size: clamp(20px, 6vw, 28px); color: #333; margin-bottom: 8px; font-weight: 700; }
        .subtitle { color: #666; font-size: clamp(14px, 4vw, 16px); margin-bottom: 25px; }
        
        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab { 
            flex: 1; padding: 12px; background: #f5f5f5; border: 2px solid #000; 
            border-radius: 10px; font-size: clamp(12px, 3.5vw, 14px); font-weight: bold; 
            cursor: pointer; color: #666; text-decoration: none; text-align: center;
        }
        .tab.active { background: #e8e8e8; color: #000; border-color: #000; }

        /* FORMULARIO */
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: bold; font-size: 13px; }
        
        .input-wrapper { 
            display: flex; align-items: center; background: #fff; 
            border: 2px solid #000; border-radius: 10px; padding: 0 15px; 
        }
        .form-group input { 
            width: 100%; padding: 12px 0; border: none; outline: none; 
            font-size: 16px; 
            background: transparent; 
        }

        .btn-submit { 
            width: 100%; padding: 16px; background: #ff6b00; color: white; 
            border: 3px solid #000; border-radius: 12px; font-size: 16px; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; box-shadow: 4px 4px 0px #000; 
            transition: 0.2s; margin-top: 10px;
        }
        .btn-submit:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        #messageBox { padding: 10px; border-radius: 10px; margin-bottom: 20px; display: none; border: 2px solid; font-weight: bold; font-size: 13px; text-align: center; }

        @media (max-width: 350px) {
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="pizza-rain" id="pizzaRain"></div>

    <div class="container">
        <div class="logo-container">
            <img src="imagenes/logofred.png" alt="Logo">
        </div>
        
        <h1>Freddy´s Pizza</h1>
        <p class="subtitle">¡Únete a la familia pizzería!</p>

        <div id="messageBox"></div>

        <div class="tabs">
            <a href="login.html" class="tab">Iniciar Sesión</a>
            <button class="tab active">Registrarse</button>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>Nombre Completo</label>
                <div class="input-wrapper">
                    <input type="text" id="nameInput" placeholder="Ej. Juan Pérez" required>
                </div>
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <div class="input-wrapper">
                    <input type="email" id="emailInput" placeholder="tu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="registerPassword" placeholder="******" required>
                </div>
            </div>

            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="******" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Crear Cuenta</button>
        </form>
    </div>

    <script>
        // EFECTO LLUVIA DE PIZZAS
        function createPizza() {
            const rainContainer = document.getElementById('pizzaRain');
            const pizza = document.createElement('img');
            const imageType = Math.random() > 0.5 ? 'caida.png' : 'caida2.png';
            pizza.src = `imagenes/${imageType}`; 
            pizza.classList.add('pizza-drop');
            pizza.style.left = Math.random() * 100 + "vw";
            
            const duration = Math.random() * 8 + 9;
            pizza.style.animationDuration = duration + "s";
            const size = Math.random() * 50 + 44;
            pizza.style.width = size + "px";
            
            pizza.style.transform = `rotate(${Math.random() * 360}deg)`;
            rainContainer.appendChild(pizza);
            setTimeout(() => { pizza.remove(); }, (duration + 1) * 1000);
        }
        setInterval(createPizza, 550);

        // LÓGICA SUPABASE
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('registerForm');
        const msg = document.getElementById('messageBox');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                return showMsg('❌ Las contraseñas no coinciden', true);
            }
            if (password.length < 6) {
                return showMsg('❌ Contraseña muy corta (mín. 6)', true);
            }

            btn.disabled = true;
            btn.textContent = 'PROCESANDO...';
            msg.style.display = 'none';

            const { data, error } = await _supabase.auth.signUp({ 
                email, 
                password,
                options: {
                    data: { 
                        full_name: nombre, 
                        rol: 'usuario' 
                    } 
                }
            });

            if (error) {
                showMsg("❌ Error: " + error.message, true);
                resetBtn();
                return;
            }

            if (data.user) {
                showMsg('✅ ¡Registro exitoso! Redirigiendo...', false);
                form.reset();
                setTimeout(() => window.location.href = 'login.html', 2500);
            }
        });

        function showMsg(txt, isErr) {
            msg.textContent = txt;
            msg.style.display = 'block';
            msg.style.backgroundColor = isErr ? '#fcebeb' : '#ebfbee';
            msg.style.color = isErr ? '#e3342f' : '#1f9d55';
            msg.style.borderColor = isErr ? '#e3342f' : '#1f9d55';
        }

        function resetBtn() {
            btn.disabled = false;
            btn.textContent = 'Crear Cuenta';
        }
    </script>
</body>
</html>
