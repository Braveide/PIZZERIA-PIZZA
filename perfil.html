<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Mi Perfil</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 5px solid #ff6b35; }
        h2 { margin: 10px 0; color: #333; }
        p { color: #666; margin-bottom: 25px; font-size: 16px; }
        .btn-logout { background: #ff4500; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; transition: background 0.3s; }
        .btn-logout:hover { background: #e03e00; }
        .btn-back { display: block; margin-top: 15px; color: #ff6b35; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <img id="user-picture" src="https://via.placeholder.com/120" alt="Foto de perfil" class="profile-pic">
        
        <h2 id="user-name">Cargando...</h2>
        
        <p id="user-email">cargando...</p>
        
        <button class="btn-logout" onclick="logout()">🚪 Cerrar Sesión</button>
        <a href="index.html" class="btn-back">← Volver al Catálogo</a>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Leer los datos guardados en el login
        const userDataJSON = localStorage.getItem('userPizzaApp');

        if (userDataJSON) {
            try {
                const userData = JSON.parse(userDataJSON);

                // 2. Insertar los datos en el HTML
                document.getElementById('user-name').textContent = userData.name;
                document.getElementById('user-email').textContent = userData.email;
                if(userData.picture) {
                    document.getElementById('user-picture').src = userData.picture;
                }
            } catch (e) {
                console.error("Error al parsear datos de usuario", e);
                window.location.href = 'login.html'; // Si hay error, al login
            }
        } else {
            // Si no hay sesión, volver al login
            window.location.href = 'login.html';
        }
    });

    // Función para cerrar sesión
    function logout() {
        localStorage.removeItem('userPizzaApp');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
