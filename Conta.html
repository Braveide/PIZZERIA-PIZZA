<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Formulario</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    
    <style>
        /* --- ANIMACIONES AÑADIDAS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ESTILOS REFINADOS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #fdf2e9; 
            color: #333; 
            overflow-x: hidden;
            padding-bottom: 50px;
        }
        
        /* HEADER - TAMAÑO AJUSTADO */
        .header { 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('imagenes/bannerin.png') center/cover no-repeat;
            padding: 45px 20px 60px 20px; 
            color: white; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background-image: 
                linear-gradient(45deg, #fff 25%, transparent 25%), 
                linear-gradient(-45deg, #fff 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #fff 75%),
                linear-gradient(-45deg, transparent 75%, #fff 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #000;
        }

        .header-title h1 { 
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(22px, 6vw, 36px); 
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #000;
        }

        /* BOTÓN VOLVER AL INICIO */
        .back-btn { 
            text-decoration: none; 
            color: #000; 
            font-weight: bold; 
            padding: 10px 24px; 
            background: #fff; 
            border: 3px solid #000;
            border-radius: 30px; 
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            font-size: 13px;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
            z-index: 10;
        }
        .back-btn:hover { 
            background: #ff6b00; 
            color: white; 
            transform: translateY(-2px);
            box-shadow: 2px 2px 0px #000;
        }

        /* CONTENEDOR DEL FORMULARIO CON ANIMACIÓN */
        .container-contact { 
            max-width: 600px; 
            width: 92%;
            margin: 40px auto; 
            padding: 35px; 
            background: white; 
            border-radius: 20px; 
            border: 3px solid #000;
            box-shadow: 10px 10px 0px #000; 
            animation: fadeInUp 0.8s ease-out; /* <-- Aquí la animación */
        }

        .contact-title { 
            font-family: 'Archivo Black', sans-serif; 
            color: #ff6b00; 
            text-transform: uppercase; 
            margin-bottom: 10px;
            text-align: center;
        }
        
        .contact-subtitle { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #666; 
            font-weight: 600;
        }
        
        /* FORMULARIO */
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            color: #000; 
            text-transform: uppercase;
            font-size: 14px;
        }
        
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #000; 
            border-radius: 10px; 
            font-family: inherit; 
            font-size: 16px;
            background: #fdf2e9;
        }
        
        .form-group textarea { resize: vertical; height: 130px; }

        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            background: #ff6b00; 
            color: white; 
            border: 3px solid #000; 
            border-radius: 15px; 
            font-size: 19px; 
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
            cursor: pointer; 
            box-shadow: 5px 5px 0px #000;
            transition: all 0.2s; 
        }
        /* EFECTO DE ESCALA AL PASAR EL MOUSE (Como la otra interfaz) */
        .submit-btn:hover { 
            transform: scale(1.02) translateY(-3px); 
            box-shadow: 8px 8px 0px #000;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        
        #successMessage { 
            display: none; 
            background-color: #d4edda; 
            color: #155724; 
            border: 3px solid #155724; 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center; 
            margin-bottom: 20px; 
            font-weight: bold;
            animation: fadeInUp 0.5s ease-out;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="header-title">
                <h1>FREDDY'S PIZZA</h1>
            </div>
        </div>
        <div class="header-right">
            <a href="index.html" class="back-btn">Volver al Inicio</a>
        </div>
    </header>

    <div class="container-contact">
        <h2 class="contact-title">¿Tienes alguna duda?</h2>
        <p class="contact-subtitle">Déjanos tu mensaje y te responderemos pronto.</p>
        
        <div id="successMessage">¡Mensaje enviado con éxito!</div>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" name="name" required placeholder="Tu nombre">
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@correo.com">
            </div>
            
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" name="message" required placeholder="¿En qué podemos ayudarte?"></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Enviar Mensaje</button>
        </form>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const form = event.target;
            const successMessage = document.getElementById('successMessage');
            form.style.display = 'none';
            successMessage.style.display = 'block';
            form.reset();
        });
    </script>
</body>
</html>
