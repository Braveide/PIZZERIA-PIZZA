<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Gestión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #a855f7; --dark: #1e293b; --light-bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--light-bg); color: var(--dark); }

        /* Header */
        .header { background: var(--dark); padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { text-decoration: none; color: white; font-size: 24px; }

        .main-content { max-width: 900px; margin: 40px auto; padding: 0 20px; }

        /* Buscador Estilo "Raro" y Pro */
        .search-group { position: relative; margin-bottom: 35px; }
        .search-input { 
            width: 100%; padding: 18px 25px 18px 55px; 
            border: none; border-radius: 20px; font-size: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .search-input:focus { outline: none; box-shadow: 0 10px 25px rgba(168, 85, 247, 0.2); transform: translateY(-2px); }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--primary); }

        /* Botón Nuevo */
        .btn-new { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 15px; font-weight: bold; cursor: pointer; float: right; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3); }

        /* Tarjetas */
        .user-card { background: white; border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .user-info h3 { font-size: 18px; margin-bottom: 5px; }
        .user-info p { font-size: 14px; color: #64748b; }
        
        .tag { padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 5px; display: inline-block; }
        .tag-admin { background: #fee2e2; color: #ef4444; }
        .tag-usuario { background: #f1f5f9; color: #475569; }

        .actions { display: flex; gap: 10px; }
        .btn-action { width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer; transition: 0.2s; }
        .edit { background: #eff6ff; color: #3b82f6; }
        .delete { background: #fef2f2; color: #ef4444; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); z-index: 1000; }
        .modal-content { background: white; padding: 40px; border-radius: 30px; width: 100%; max-width: 450px; }
        .modal input, .modal select { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 12px; }
        .btn-save { background: var(--primary); color: white; width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <a href="panelA.html" class="back-btn">←</a>
        <h1>Freddy's Admin</h1>
        <div style="width: 40px;"></div>
    </header>

    <main class="main-content">
        <button class="btn-new" onclick="openModal()">+ Nuevo Usuario</button>
        <div style="clear: both;"></div>

        <div class="search-group">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre, email o teléfono..." onkeyup="render()">
        </div>

        <div id="userList"></div>
    </main>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 20px;">Usuario</h2>
            <form id="userForm">
                <input type="hidden" id="userId">
                <input type="text" id="userName" placeholder="Nombre Completo" required>
                <input type="email" id="userEmail" placeholder="Email" required>
                <div id="passArea">
                    <input type="password" id="userPass" placeholder="Contraseña">
                </div>
                <input type="text" id="userPhone" placeholder="Teléfono">
                <select id="userRole">
                    <option value="usuario">Usuario</option>
                    <option value="vendedor">Vendedor</option>
                    <option value="admin">Administrador</option>
                </select>
                <button type="submit" class="btn-save">Guardar Datos</button>
                <button type="button" onclick="closeModal()" style="width:100%; background:none; border:none; color:#94a3b8; margin-top:15px; cursor:pointer;">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; // USA TU KEY REAL AQUÍ
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let users = [];

        async function load() {
            const { data, error } = await _supabase.from('perfiles').select('*');
            if (error) return;
            users = data;
            render();
        }

        function render() {
            const list = document.getElementById('userList');
            const term = document.getElementById('searchInput').value.toLowerCase();
            list.innerHTML = '';

            users.filter(u => 
                (u.nombre || '').toLowerCase().includes(term) || 
                u.email.toLowerCase().includes(term)
            ).forEach(u => {
                list.innerHTML += `
                    <div class="user-card">
                        <div class="user-info">
                            <h3>${u.nombre || 'Sin nombre'}</h3>
                            <p>${u.email}</p>
                            <p>📞 ${u.telefono || 'No hay teléfono'}</p>
                            <span class="tag tag-${u.rol}">${u.rol}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-action edit" onclick="editUser('${u.id}')">✏️</button>
                            <button class="btn-action delete" onclick="deleteUser('${u.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(edit = false) {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('passArea').style.display = edit ? 'none' : 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('userModal').style.display = 'none'; }

        function editUser(id) {
            const u = users.find(user => user.id === id);
            openModal(true);
            document.getElementById('userId').value = u.id;
            document.getElementById('userName').value = u.nombre || '';
            document.getElementById('userEmail').value = u.email;
            document.getElementById('userPhone').value = u.telefono || '';
            document.getElementById('userRole').value = u.rol;
            document.getElementById('modalTitle').innerText = "Editar Perfil";
        }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const payload = {
                nombre: document.getElementById('userName').value,
                rol: document.getElementById('userRole').value,
                telefono: document.getElementById('userPhone').value
            };

            if (id) {
                // EDITAR: Solo actualiza la tabla perfiles
                await _supabase.from('perfiles').update(payload).eq('id', id);
            } else {
                // CREAR: Registra en Auth (La función SQL se encarga de Perfiles)
                const email = document.getElementById('userEmail').value;
                const password = document.getElementById('userPass').value;
                const { error } = await _supabase.auth.signUp({
                    email, password,
                    options: { data: payload }
                });
                if (error) alert(error.message);
            }
            closeModal();
            load();
        };

        async function deleteUser(id) {
            if (confirm('¿Borrar este usuario?')) {
                await _supabase.from('perfiles').delete().eq('id', id);
                load();
            }
        }

        load();
    </script>
</body>
</html>
