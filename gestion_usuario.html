<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        /* Animación para que la ventana salga con estilo */
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        :root { --freddy-orange: #ff6b00; --freddy-dark: #000; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdf2e9; color: #333; overflow-x: hidden; }
        
        /* HEADER ORIGINAL */
        .header { 
            background: #fff; padding: 15px 25px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 4px solid #000; position: sticky; top: 0; z-index: 1000; 
        }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; }
        .logo-text { font-family: 'Archivo Black', sans-serif; font-size: 22px; color: #ff4500; text-shadow: 2px 2px 0px #000; }

        .header-right { display: flex; gap: 15px; align-items: center; }

        /* BOTÓN DE USUARIO CIRCULAR */
        .user-btn-circle { 
            width: 48px; height: 48px; border-radius: 50%; border: 3px solid #000; 
            cursor: pointer; overflow: hidden; background: #fff; transition: 0.3s;
            box-shadow: 3px 3px 0px #000; display: flex; align-items: center; justify-content: center;
        }
        .user-btn-circle:hover { transform: scale(1.1); }
        .user-btn-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* VENTANA FLOTANTE (MODAL) */
        .user-modal {
            display: none; position: absolute; top: 70px; right: 0; 
            width: 280px; background: #fff; border: 4px solid #000; 
            border-radius: 20px; box-shadow: 8px 8px 0px #000; 
            padding: 20px; z-index: 2000; animation: popIn 0.25s ease-out;
        }
        .user-modal.active { display: block; }

        .modal-profile-box { text-align: center; margin-bottom: 20px; }
        .modal-photo {
            width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--freddy-orange);
            margin-bottom: 10px; object-fit: cover; box-shadow: 4px 4px 0px #000;
        }
        .modal-name { font-family: 'Archivo Black', sans-serif; font-size: 16px; margin-bottom: 4px; color: #000; }
        .modal-email { font-size: 11px; color: #666; margin-bottom: 10px; word-break: break-all; }

        /* BOTONES DEL MODAL */
        .modal-nav { display: flex; flex-direction: column; gap: 10px; }
        .m-btn {
            text-decoration: none; color: #000; font-weight: 900; padding: 12px;
            border: 3px solid #000; border-radius: 12px; text-align: center;
            transition: 0.2s; box-shadow: 4px 4px 0px #000; text-transform: uppercase; font-size: 12px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .m-btn:hover { background: var(--freddy-orange); color: #fff; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
        
        /* Botón Admin Negro */
        .btn-admin { background: #000; color: #fff; }
        
        .btn-logout { 
            margin-top: 15px; color: #ff3d00; font-weight: 900; cursor: pointer; 
            border: none; background: none; text-transform: uppercase; font-size: 11px;
            width: 100%; text-align: center; border-top: 1px solid #eee; padding-top: 15px;
        }

        /* CARRUSEL Y GRID (TU DISEÑO ORIGINAL) */
        .hero-swiper { width: 100%; min-height: 500px; border-bottom: 5px solid #000; background-image: url('imagenes/carrusel.png'); background-size: cover; background-position: center; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .slide-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; width: 100%; max-width: 1100px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 30px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.3); }
        .slide-text h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(28px, 5vw, 55px); color: #fff; text-shadow: 3px 3px 0px #000; text-transform: uppercase; line-height: 1; margin-bottom: 15px; }
        .slide-text p { font-size: clamp(14px, 2vw, 18px); font-weight: 600; color: #fff; margin-bottom: 25px; text-shadow: 1px 1px 5px rgba(0,0,0,0.7); }
        .slide-img { max-height: 350px; width: auto; max-width: 100%; border-radius: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 5px solid #fff; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .section-title { font-family: 'Archivo Black', sans-serif; text-align: center; margin-bottom: 40px; font-size: clamp(24px, 5vw, 35px); text-transform: uppercase; color: #000; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        
        .card { background: white; border-radius: 20px; border: 3px solid #000; overflow: hidden; box-shadow: 6px 6px 0px #000; transition: 0.3s; display: flex; flex-direction: column; }
        .card-image { width: 100%; height: 230px; object-fit: cover; border-bottom: 3px solid #000; }
        .card-info { padding: 25px; flex-grow: 1; }
        .card-price { color: #ff6b00; font-size: 26px; font-weight: 900; }
        .add-btn { background: #fff; border: 3px solid #000; padding: 12px 20px; border-radius: 15px; cursor: pointer; font-weight: 900; box-shadow: 4px 4px 0px #000; text-transform: uppercase; font-size: 13px; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-container">
            <img src="imagenes/logo.png" alt="Logo" class="logo-img">
            <span class="logo-text">FREDDY'S PIZZA</span>
        </a>
        <div class="header-right">
            <div style="position: relative;" id="menuWrapper">
                <div class="user-btn-circle" id="userBtn">
                    <span id="userInitial">👤</span>
                </div>

                <div class="user-modal" id="userModal">
                    <div class="modal-profile-box">
                        <img src="https://via.placeholder.com/80" id="modalPhoto" class="modal-photo">
                        <h3 id="modalName" class="modal-name">Cargando...</h3>
                        <p id="modalEmail" class="modal-email">email@ejemplo.com</p>
                    </div>
                    
                    <nav class="modal-nav">
                        <div id="adminLinkContainer"></div> <a href="perfil_cliente.html" class="m-btn">👤 Mi Perfil</a>
                    </nav>

                    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>

            <a href="carrito.html" class="user-btn-circle" style="text-decoration:none; font-size: 22px;">
                🛒<span id="cartBadge" style="position:absolute; top:-5px; right:-5px; background:red; color:white; font-size:10px; padding:2px 6px; border-radius:50%; display:none; border:2px solid #000;">0</span>
            </a>
        </div>
    </header>

    <section class="swiper hero-swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="slide-container">
                    <div class="slide-text">
                        <h1>Pepperoni <br> Legendario</h1>
                        <p>Nuestra pizza estrella con pepperoni de corte grueso y una mezcla secreta de quesos derretidos.</p>
                        <a href="#menu" class="m-btn" style="display:inline-block; background:#fff">¡ORDENAR YA!</a>
                    </div>
                    <img src="imagenes/pizza_pepe.png" class="slide-img" alt="Pizza">
                </div>
            </div>
        </div>
        <div class="swiper-button-next" style="color:#fff"></div>
        <div class="swiper-button-prev" style="color:#fff"></div>
        <div class="swiper-pagination"></div>
    </section>

    <div class="container" id="menu">
        <h2 class="section-title">Especialidades</h2>
        <div class="grid-container" id="pizzasGrid">
            <div class="card">
                <img src="imagenes/pizza_pepe.png" class="card-image">
                <div class="card-info">
                    <h3 style="font-family:'Archivo Black'">Pepperoni Premium</h3>
                    <p style="font-size:14px; color:#666; margin: 10px 0;">Extra pepperoni y mucho queso.</p>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="card-price">$121.99</span>
                        <button class="add-btn">AGREGAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const userBtn = document.getElementById('userBtn');
        const userModal = document.getElementById('userModal');

        // Toggle del modal
        userBtn.onclick = (e) => {
            e.stopPropagation();
            userModal.classList.toggle('active');
        };

        // Cerrar al hacer clic fuera
        window.onclick = (e) => {
            if (!document.getElementById('menuWrapper').contains(e.target)) {
                userModal.classList.remove('active');
            }
        };

        async function initAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (user) {
                const { data: perfil } = await supabaseClient.from('perfiles').select('*').eq('id', user.id).single();
                
                const nombre = perfil?.nombre || 'Usuario';
                const foto = perfil?.foto_url || null;
                const rol = perfil?.rol || 'usuario';

                // Update UI
                if (foto) {
                    userBtn.innerHTML = `<img src="${foto}">`;
                    document.getElementById('modalPhoto').src = foto;
                } else {
                    document.getElementById('userInitial').innerText = user.email.charAt(0).toUpperCase();
                }

                document.getElementById('modalName').innerText = nombre;
                document.getElementById('modalEmail').innerText = user.email;

                // Botón de Admin estilizado
                if (rol === 'admin') {
                    document.getElementById('adminLinkContainer').innerHTML = `
                        <a href="panelA.html" class="m-btn btn-admin">⚙️ PANEL ADMIN</a>
                    `;
                }
            } else {
                userBtn.onclick = () => window.location.href = 'login.html';
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            new Swiper('.hero-swiper', {
                loop: true,
                autoplay: { delay: 4000 },
                pagination: { el: '.swiper-pagination' },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }
            });
        });
    </script>
</body>
</html>
