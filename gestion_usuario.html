<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Gestión de Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ... Mantén tus estilos anteriores ... */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filter-select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: white;
            outline: none;
        }
        .role-vendedor { background: #fef3c7; color: #92400e; } /* Estilo para vendedores */
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="panelA.html" class="back-btn">←</a>
            <h1>Freddy's Admin</h1>
        </div>
        <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <main class="main-content">
        <div class="section-header">
            <div class="title-group">
                <h2>Gestión de Usuarios</h2>
                <p>Administra la base de datos de tus clientes y empleados</p>
            </div>
            <button class="new-user-btn" onclick="openUserModal()">
                <span>+</span> Nuevo Usuario
            </button>
        </div>

        <div class="filter-container">
            <div class="search-box" style="flex: 1; margin-bottom: 0;">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar por nombre, email..." onkeyup="filterUsers()">
            </div>
            <select id="roleFilter" class="filter-select" onchange="filterUsers()">
                <option value="all">Todos los Roles</option>
                <option value="admin">Administradores</option>
                <option value="usuario">Usuarios</option>
                <option value="vendedor">Vendedores</option>
            </select>
        </div>

        <div id="userList" class="user-list">
            </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; // Tu clave actual
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let users = [];

        async function init() {
            await fetchUsers();
        }

        async function fetchUsers() {
            // Eliminamos .order('created_at') porque no existe esa columna en tu captura
            const { data, error } = await _supabase
                .from('perfiles')
                .select('*');

            if (error) {
                console.error('Error:', error.message);
                return;
            }
            users = data;
            render();
        }

        function render(dataToRender = users) {
            const list = document.getElementById('userList');
            list.innerHTML = '';

            if (dataToRender.length === 0) {
                list.innerHTML = `<p style="text-align:center; padding:20px; color:#94a3b8;">No se encontraron resultados.</p>`;
                return;
            }

            dataToRender.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                // Usamos los nombres exactos de tu tabla: nombre, email, rol, telefono
                card.innerHTML = `
                    <div class="user-info">
                        <h3 style="color: ${user.color || '#1e293b'}">${user.nombre || 'Usuario sin nombre'}</h3>
                        <span class="email">${user.email}</span>
                        <div class="user-stats">
                            <span class="stat-tag">📞 ${user.telefono || 'Sin Teléfono'}</span>
                            <span class="stat-tag ${user.rol === 'vendedor' ? 'role-vendedor' : ''}">🛡️ ${user.rol || 'usuario'}</span>
                            <span class="stat-tag">🆔 ${user.id.substring(0,8)}...</span>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="action-btn edit-btn" onclick="editUser('${user.id}')">✏️</button>
                        <button class="action-btn delete-btn" onclick="deleteUser('${user.id}')">🗑️</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function filterUsers() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const role = document.getElementById('roleFilter').value;

            const filtered = users.filter(u => {
                const matchesSearch = (u.nombre && u.nombre.toLowerCase().includes(term)) || 
                                     u.email.toLowerCase().includes(term);
                const matchesRole = (role === 'all' || u.rol === role);
                
                return matchesSearch && matchesRole;
            });
            render(filtered);
        }

        // ... Mantener funciones de abrir/cerrar modal y eliminar ...

        init();
    </script>
</body>
</html>
