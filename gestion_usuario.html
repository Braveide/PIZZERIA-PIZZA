<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Control Maestro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #a855f7; --dark: #0f172a; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--dark); }

        /* Header con Admin Perfil */
        .header { background: var(--dark); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .admin-box { display: flex; align-items: center; gap: 12px; }
        .admin-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        /* Controles */
        .top-bar { display: flex; gap: 15px; margin-bottom: 25px; }
        .input-styled { padding: 12px 18px; border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); outline: none; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-reset { background: #6366f1; color: white; margin-top: 5px; font-size: 12px; }

        /* Tarjetas de Usuario */
        .user-card { background: white; padding: 20px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .role-tag { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .tag-admin { background: #fee2e2; color: #ef4444; }
        .tag-vendedor { background: #fef3c7; color: #d97706; }
        .tag-usuario { background: #e0e7ff; color: #4338ca; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    </style>
</head>
<body>

    <header class="header">
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="panelA.html" style="color:white; text-decoration:none;">← Volver</a>
            <h1>Freddy's Admin 🍕</h1>
        </div>
        <div class="admin-box">
            <div style="text-align:right">
                <p id="curAdminName" style="font-size:14px; font-weight:bold;">Cargando...</p>
                <p id="curAdminRole" style="font-size:11px; color:var(--primary);">ADMIN</p>
            </div>
            <img id="curAdminImg" src="https://via.placeholder.com/40" class="admin-img">
        </div>
    </header>

    <div class="container">
        <div class="top-bar">
            <input type="text" id="searchInput" class="input-styled" style="flex:2" placeholder="Buscar usuario..." onkeyup="render()">
            <select id="roleFilter" class="input-styled" onchange="render()">
                <option value="todos">Todos los Roles</option>
                <option value="admin">Administradores</option>
                <option value="vendedor">Vendedores</option>
                <option value="usuario">Usuarios</option>
            </select>
            <button class="btn btn-primary" onclick="openModal()">+ Nuevo</button>
        </div>

        <div id="userList"></div>
    </div>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Usuario</h2>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="userName" class="input-styled" style="border:1px solid #ddd" required>
                </div>
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" id="userEmail" class="input-styled" style="border:1px solid #ddd" required>
                </div>
                <div class="form-group" id="passArea">
                    <label>Contraseña</label>
                    <input type="password" id="userPass" class="input-styled" style="border:1px solid #ddd">
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select id="userRole" class="input-styled" style="border:1px solid #ddd">
                        <option value="usuario">Usuario</option>
                        <option value="vendedor">Vendedor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Guardar Cambios</button>
                <button type="button" class="btn" style="width:100%; margin-top:10px;" onclick="closeModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allUsers = [];

        async function loadAdmin() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                const { data: profile } = await _supabase.from('perfiles').select('*').eq('id', user.id).single();
                if (profile) {
                    document.getElementById('curAdminName').innerText = profile.nombre || user.email;
                    if (profile.foto_url) document.getElementById('curAdminImg').src = profile.foto_url;
                }
            }
        }

        async function load() {
            const { data, error } = await _supabase.from('perfiles').select('*').order('created_at', {ascending: false});
            if (error) return console.log(error);
            allUsers = data;
            render();
        }

        function render() {
            const list = document.getElementById('userList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('roleFilter').value;
            list.innerHTML = '';

            const filtered = allUsers.filter(u => {
                const matchSearch = (u.nombre || '').toLowerCase().includes(search) || u.email.toLowerCase().includes(search);
                const matchRole = filter === 'todos' || u.rol === filter;
                return matchSearch && matchRole;
            });

            filtered.forEach(u => {
                list.innerHTML += `
                    <div class="user-card">
                        <div>
                            <strong>${u.nombre || 'Sin nombre'}</strong><br>
                            <small style="color:gray">${u.email}</small><br>
                            <span class="role-tag tag-${u.rol}">${u.rol}</span>
                        </div>
                        <div style="display:flex; gap:10px">
                            <button class="btn" style="background:#e0f2fe" onclick="editUser('${u.id}')">✏️</button>
                            <button class="btn" style="background:#fee2e2" onclick="deleteUser('${u.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(isEdit = false) {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('passArea').style.display = isEdit ? 'none' : 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('userModal').style.display = 'none'; }

        function editUser(id) {
            const u = allUsers.find(x => x.id === id);
            openModal(true);
            document.getElementById('userId').value = u.id;
            document.getElementById('userName').value = u.nombre || '';
            document.getElementById('userEmail').value = u.email;
            document.getElementById('userRole').value = u.rol;
            document.getElementById('modalTitle').innerText = "Editar Usuario";
        }

        // ELIMINAR REAL EN DB
        async function deleteUser(id) {
            if (confirm("¿Eliminar usuario de la base de datos?")) {
                const { error } = await _supabase.rpc('admin_delete_user', { target_user_id: id });
                if (error) {
                    // Fallback si no hay RPC
                    await _supabase.from('perfiles').delete().eq('id', id);
                }
                alert("Usuario eliminado");
                load();
            }
        }

        // GUARDAR CAMBIOS REAL EN DB
        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const data = {
                nombre: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                rol: document.getElementById('userRole').value
            };

            if (id) {
                const { error } = await _supabase.from('perfiles').update(data).eq('id', id);
                if (error) alert(error.message);
                else alert("Datos actualizados");
            } else {
                const pass = document.getElementById('userPass').value;
                const { error } = await _supabase.auth.signUp({
                    email: data.email,
                    password: pass,
                    options: { data: data }
                });
                if (error) alert(error.message);
                else alert("Usuario creado");
            }
            closeModal();
            load();
        };

        loadAdmin();
        load();
    </script>
</body>
</html>
