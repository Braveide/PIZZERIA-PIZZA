<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Gestión de Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos modernos basados en tu diseño */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
        
        .header { background: #1e293b; padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { text-decoration: none; color: white; font-size: 20px; }
        .logout-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        .main-content { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
        
        .new-user-btn { background: #a855f7; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3); }

        .search-box input { width: 100%; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 25px; }

        .user-list { display: grid; gap: 16px; }
        .user-card { background: white; border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        
        .user-info h3 { font-size: 18px; color: #1e293b; }
        .email { color: #64748b; font-size: 14px; display: block; margin-bottom: 8px; }
        
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
        .tag-admin { background: #fee2e2; color: #ef4444; }
        .tag-vendedor { background: #fef3c7; color: #d97706; }
        .tag-usuario { background: #f1f5f9; color: #475569; }

        .action-btn { width: 35px; height: 35px; border-radius: 8px; border: none; cursor: pointer; margin-left: 5px; }
        .edit-btn { background: #eff6ff; color: #3b82f6; }
        .delete-btn { background: #fef2f2; color: #ef4444; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; }
        .modal input, .modal select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        .btn-save { background: #a855f7; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="panelA.html" class="back-btn">←</a>
            <h1>Freddy's Admin</h1>
        </div>
        <button class="logout-btn" onclick="location.href='login.html'">Cerrar Sesión</button>
    </header>

    <main class="main-content">
        <div class="section-header">
            <div>
                <h2>Gestión de Usuarios</h2>
                <p style="color: #64748b;">Administra cuentas y roles del sistema</p>
            </div>
            <button class="new-user-btn" onclick="openModal()">+ Nuevo Usuario</button>
        </div>

        <input type="text" id="searchInput" placeholder="Buscar por nombre o email..." onkeyup="render()">

        <div id="userList" class="user-list">
            </div>
    </main>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Nuevo Usuario</h2>
            <form id="userForm">
                <input type="hidden" id="userId">
                <input type="text" id="userName" placeholder="Nombre Completo" required>
                <input type="email" id="userEmail" placeholder="Correo Electrónico" required>
                <div id="passWrapper">
                    <input type="password" id="userPass" placeholder="Contraseña (mín. 6 caracteres)">
                </div>
                <input type="text" id="userPhone" placeholder="Teléfono">
                <select id="userRole">
                    <option value="usuario">Usuario</option>
                    <option value="vendedor">Vendedor</option>
                    <option value="admin">Administrador</option>
                </select>
                <button type="submit" class="btn-save">Guardar Cambios</button>
                <button type="button" onclick="closeModal()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; // Reemplaza con tu key
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allUsers = [];

        async function loadUsers() {
            const { data, error } = await _supabase.from('perfiles').select('*');
            if (error) return console.error(error);
            allUsers = data;
            render();
        }

        function render() {
            const container = document.getElementById('userList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filtered = allUsers.filter(u => 
                (u.nombre || '').toLowerCase().includes(search) || 
                u.email.toLowerCase().includes(search)
            );

            filtered.forEach(user => {
                const roleClass = `tag-${user.rol}`;
                container.innerHTML += `
                    <div class="user-card">
                        <div>
                            <h3>${user.nombre || 'Usuario sin nombre'}</h3>
                            <span class="email">${user.email}</span>
                            <span class="tag ${roleClass}">${user.rol}</span>
                            <span style="font-size: 12px; color: #94a3b8; margin-left: 10px;">📞 ${user.telefono || 'Sin tel.'}</span>
                        </div>
                        <div>
                            <button class="action-btn edit-btn" onclick="editUser('${user.id}')">✏️</button>
                            <button class="action-btn delete-btn" onclick="deleteUser('${user.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(isEdit = false) {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('modalTitle').innerText = isEdit ? 'Editar Usuario' : 'Nuevo Usuario';
            document.getElementById('passWrapper').style.display = isEdit ? 'none' : 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('userModal').style.display = 'none'; }

        function editUser(id) {
            const user = allUsers.find(u => u.id === id);
            openModal(true);
            document.getElementById('userId').value = user.id;
            document.getElementById('userName').value = user.nombre || '';
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userPhone').value = user.telefono || '';
            document.getElementById('userRole').value = user.rol;
        }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const email = document.getElementById('userEmail').value;
            const nombre = document.getElementById('userName').value;
            const rol = document.getElementById('userRole').value;
            const telefono = document.getElementById('userPhone').value;

            if (id) {
                // Actualizar perfil existente
                await _supabase.from('perfiles').update({ nombre, rol, telefono }).eq('id', id);
            } else {
                // Crear nuevo usuario en AUTH
                const password = document.getElementById('userPass').value;
                const { data, error } = await _supabase.auth.signUp({
                    email, password, 
                    options: { data: { nombre, rol, telefono } }
                });
                if (error) return alert(error.message);
                alert('Usuario creado. Debe confirmar su correo (o puedes desactivar la confirmación en Supabase Auth Settings).');
            }
            closeModal();
            loadUsers();
        };

        async function deleteUser(id) {
            if (confirm('¿Eliminar este usuario definitivamente?')) {
                await _supabase.from('perfiles').delete().eq('id', id);
                loadUsers();
            }
        }

        loadUsers();
    </script>
</body>
</html>
