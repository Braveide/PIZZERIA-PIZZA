<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Control de Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #a855f7; --dark: #0f172a; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--dark); }

        /* Header Estilo Freddy's */
        .header { background: var(--dark); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); }
        .admin-info { display: flex; align-items: center; gap: 12px; }
        .admin-img-wrapper { position: relative; width: 42px; height: 42px; }
        .admin-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; background: #334155; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        /* Barra de herramientas */
        .top-bar { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .input-styled { padding: 14px; border: 1px solid #e2e8f0; border-radius: 14px; outline: none; transition: 0.3s; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-primary { background: var(--primary); color: white; }

        /* Tarjetas de Usuario */
        .user-card { background: white; padding: 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .user-meta img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #eee; }
        .role-tag { padding: 4px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; display: inline-block; margin-top: 5px; }
        .tag-admin { background: #fee2e2; color: #ef4444; }
        .tag-vendedor { background: #fef3c7; color: #d97706; }
        .tag-usuario { background: #f1f5f9; color: #475569; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); z-index: 999; }
        .modal-content { background: white; padding: 30px; border-radius: 25px; width: 90%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        
        /* Estilo para subir foto */
        .photo-upload { text-align: center; margin-bottom: 20px; }
        .preview-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="panelA.html" style="color:white; text-decoration:none; font-size:20px;">← Volver</a>
            <h1 style="font-size: 20px;">Freddy's Admin 🍕</h1>
        </div>
        <div class="admin-info" id="adminTrigger" style="cursor:pointer">
            <div style="text-align:right">
                <p id="curAdminName" style="font-size:14px; font-weight:bold;">Cargando...</p>
                <p style="font-size:11px; color:var(--primary); font-weight: 800;">ADMINISTRADOR</p>
            </div>
            <div class="admin-img-wrapper">
                <img id="curAdminImg" src="https://via.placeholder.com/42" class="admin-img">
            </div>
        </div>
    </header>

    <div class="container">
        <div class="top-bar">
            <input type="text" id="searchInput" class="input-styled" style="flex:2" placeholder="Buscar usuario..." onkeyup="render()">
            <select id="roleFilter" class="input-styled" onchange="render()">
                <option value="todos">Todos los Roles</option>
                <option value="admin">Administradores</option>
                <option value="vendedor">Vendedores</option>
                <option value="usuario">Usuarios</option>
            </select>
            <button class="btn btn-primary" onclick="openModal()">+ Nuevo Usuario</button>
        </div>

        <div id="userList"></div>
    </div>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="text-align:center; margin-bottom:20px;">Usuario</h2>
            
            <div class="photo-upload">
                <img id="modalPreview" src="https://via.placeholder.com/80" class="preview-img">
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage(event)">
                <button type="button" class="btn" style="font-size:12px; margin:auto; background:#f1f5f9" onclick="document.getElementById('fileInput').click()">
                    📸 Cambiar Foto
                </button>
            </div>

            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label style="font-size:12px; font-weight:bold">Nombre</label>
                    <input type="text" id="userName" class="input-styled" required>
                </div>
                <div class="form-group">
                    <label style="font-size:12px; font-weight:bold">Email</label>
                    <input type="email" id="userEmail" class="input-styled" required>
                </div>
                <div class="form-group" id="passArea">
                    <label style="font-size:12px; font-weight:bold">Contraseña</label>
                    <input type="password" id="userPass" class="input-styled">
                </div>
                <div class="form-group">
                    <label style="font-size:12px; font-weight:bold">Rol</label>
                    <select id="userRole" class="input-styled">
                        <option value="usuario">Usuario</option>
                        <option value="vendedor">Vendedor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Guardar</button>
                <button type="button" class="btn" style="width:100%; margin-top:10px; background:none" onclick="closeModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allUsers = [];
        let selectedFile = null;

        async function loadAdmin() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                const { data } = await _supabase.from('perfiles').select('*').eq('id', user.id).single();
                if (data) {
                    document.getElementById('curAdminName').innerText = data.nombre || user.email;
                    if (data.foto_url) document.getElementById('curAdminImg').src = data.foto_url;
                }
            }
        }

        async function load() {
            // CORRECCIÓN: Quitamos el .order('created_at') porque no existe la columna
            const { data, error } = await _supabase.from('perfiles').select('*');
            if (error) return console.log(error);
            allUsers = data;
            render();
        }

        function render() {
            const list = document.getElementById('userList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('roleFilter').value;
            list.innerHTML = '';

            const filtered = allUsers.filter(u => {
                const matchSearch = (u.nombre || '').toLowerCase().includes(search) || u.email.toLowerCase().includes(search);
                const matchRole = filter === 'todos' || u.rol === filter;
                return matchSearch && matchRole;
            });

            filtered.forEach(u => {
                const img = u.foto_url || 'https://via.placeholder.com/45';
                list.innerHTML += `
                    <div class="user-card">
                        <div style="display:flex; gap:15px; align-items:center">
                            <img src="${img}" style="width:45px; height:45px; border-radius:50%; object-fit:cover">
                            <div>
                                <strong>${u.nombre || 'Sin nombre'}</strong><br>
                                <small style="color:gray">${u.email}</small><br>
                                <span class="role-tag tag-${u.rol}">${u.rol}</span>
                            </div>
                        </div>
                        <div style="display:flex; gap:8px">
                            <button class="btn" style="background:#f1f5f9" onclick="editUser('${u.id}')">✏️</button>
                            <button class="btn" style="background:#fee2e2; color:#ef4444" onclick="deleteUser('${u.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function previewImage(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('modalPreview').src = e.target.result;
                reader.readAsDataURL(selectedFile);
            }
        }

        function openModal(isEdit = false) {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            selectedFile = null;
            document.getElementById('modalPreview').src = 'https://via.placeholder.com/80';
            document.getElementById('passArea').style.display = isEdit ? 'none' : 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('userModal').style.display = 'none'; }

        function editUser(id) {
            const u = allUsers.find(x => x.id === id);
            openModal(true);
            document.getElementById('userId').value = u.id;
            document.getElementById('userName').value = u.nombre || '';
            document.getElementById('userEmail').value = u.email;
            document.getElementById('userRole').value = u.rol;
            if (u.foto_url) document.getElementById('modalPreview').src = u.foto_url;
            document.getElementById('modalTitle').innerText = "Editar Perfil";
        }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const payload = {
                nombre: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                rol: document.getElementById('userRole').value
            };

            // Lógica de subir foto (si hay archivo seleccionado)
            if (selectedFile) {
                const fileName = `avatars/${Date.now()}_${selectedFile.name}`;
                const { data: uploadData } = await _supabase.storage.from('fotos').upload(fileName, selectedFile);
                if (uploadData) {
                    const { data: urlData } = _supabase.storage.from('fotos').getPublicUrl(fileName);
                    payload.foto_url = urlData.publicUrl;
                }
            }

            if (id) {
                await _supabase.from('perfiles').update(payload).eq('id', id);
                alert("Actualizado");
            } else {
                const pass = document.getElementById('userPass').value;
                await _supabase.auth.signUp({ email: payload.email, password: pass, options: { data: payload } });
                alert("Usuario creado");
            }
            closeModal();
            load();
        };

        async function deleteUser(id) {
            if (confirm("¿Eliminar usuario?")) {
                await _supabase.from('perfiles').delete().eq('id', id);
                load();
            }
        }

        loadAdmin();
        load();
    </script>
</body>
</html>
