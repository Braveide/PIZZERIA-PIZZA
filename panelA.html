<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Panel Admin CRUD</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Reutilizamos tus estilos y añadimos los de CRUD */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f5f5f5; color: #333; }
        
        .header { background: #1e293b; padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .dashboard-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* Estilos de Tabla */
        .crud-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8fafc; color: #64748b; text-transform: uppercase; font-size: 12px; }
        
        /* Botones */
        .btn { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-add { background: #10b981; color: white; margin-bottom: 10px; }
        .btn-edit { background: #3b82f6; color: white; margin-right: 5px; }
        .btn-delete { background: #ef4444; color: white; }
        
        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; position: relative; }
        .modal-content h3 { margin-bottom: 20px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" style="color:white; text-decoration:none; font-size:20px;">←</a>
            <h1>Panel de Administración</h1>
        </div>
        <button onclick="cerrarSesion()" class="btn btn-delete">Cerrar Sesión</button>
    </header>

    <div class="dashboard-container">
        
        <div class="crud-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>🍕 Gestión de Pizzas</h2>
                <button class="btn btn-add" onclick="openProductModal()">+ Agregar Pizza</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="pizzaTableBody">
                    </tbody>
            </table>
        </div>

        <div class="crud-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>👥 Gestión de Usuarios</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>ID Usuario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    </tbody>
            </table>
        </div>

    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Agregar Pizza</h3>
            <input type="hidden" id="editProductId">
            <input type="text" id="pName" placeholder="Nombre de la pizza">
            <input type="number" id="pPrice" placeholder="Precio ($)">
            <input type="text" id="pDesc" placeholder="Descripción corta">
            <input type="text" id="pImg" placeholder="URL de la imagen">
            <div class="modal-actions">
                <button class="btn" onclick="closeModal('productModal')">Cancelar</button>
                <button class="btn btn-add" onclick="saveProduct()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; // Usa la misma de tu index.html
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            loadPizzas();
            loadUsers();
        });

        // --- CRUD PIZZAS ---
        async function loadPizzas() {
            const { data, error } = await supabase.from('pizzas').select('*');
            if (error) return console.log(error);
            
            const tbody = document.getElementById('pizzaTableBody');
            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>${p.nombre}</td>
                    <td>$${p.precio}</td>
                    <td>${p.descripcion}</td>
                    <td>
                        <button class="btn btn-edit" onclick="editProduct('${p.id}', '${p.nombre}', ${p.precio}, '${p.descripcion}', '${p.imagen}')">✏️</button>
                        <button class="btn btn-delete" onclick="deleteProduct('${p.id}')">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function saveProduct() {
            const id = document.getElementById('editProductId').value;
            const pizzaData = {
                nombre: document.getElementById('pName').value,
                precio: document.getElementById('pPrice').value,
                descripcion: document.getElementById('pDesc').value,
                imagen: document.getElementById('pImg').value
            };

            if (id) {
                await supabase.from('pizzas').update(pizzaData).eq('id', id);
            } else {
                await supabase.from('pizzas').insert([pizzaData]);
            }
            closeModal('productModal');
            loadPizzas();
        }

        async function deleteProduct(id) {
            if (confirm('¿Eliminar esta pizza?')) {
                await supabase.from('pizzas').delete().eq('id', id);
                loadPizzas();
            }
        }

        // --- CRUD USUARIOS (PERFILES) ---
        async function loadUsers() {
            const { data, error } = await supabase.from('perfiles').select('*');
            if (error) return;
            
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = data.map(u => `
                <tr>
                    <td>${u.email || 'S/N'}</td>
                    <td><strong>${u.rol}</strong></td>
                    <td>${u.id.slice(0,8)}...</td>
                    <td>
                        <button class="btn btn-edit" onclick="changeRole('${u.id}', '${u.rol}')">Cambiar Rol</button>
                        <button class="btn btn-delete" onclick="deleteUser('${u.id}')">Eliminar</button>
                    </td>
                </tr>
            `).join('');
        }

        async function changeRole(id, currentRole) {
            const newRole = currentRole === 'admin' ? 'cliente' : 'admin';
            await supabase.from('perfiles').update({ rol: newRole }).eq('id', id);
            loadUsers();
        }

        async function deleteUser(id) {
            if (confirm('¿Eliminar cuenta de usuario?')) {
                // Nota: Esto borra el perfil de la tabla, no el Auth de Supabase (eso se hace desde su panel)
                await supabase.from('perfiles').delete().eq('id', id);
                loadUsers();
            }
        }

        // --- UTILIDADES MODAL ---
        function openProductModal() {
            document.getElementById('modalTitle').innerText = "Agregar Pizza";
            document.getElementById('editProductId').value = "";
            document.getElementById('pName').value = "";
            document.getElementById('productModal').style.display = 'flex';
        }

        function editProduct(id, nom, pre, desc, img) {
            document.getElementById('modalTitle').innerText = "Editar Pizza";
            document.getElementById('editProductId').value = id;
            document.getElementById('pName').value = nom;
            document.getElementById('pPrice').value = pre;
            document.getElementById('pDesc').value = desc;
            document.getElementById('pImg').value = img;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        async function cerrarSesion() {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
