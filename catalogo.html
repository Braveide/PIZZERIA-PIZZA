<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Menú</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ESTILOS UNIFICADOS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #fdf2e9; 
            color: #333; 
            overflow-x: hidden;
        }
        
        /* HEADER ESTILO "BANNERIN" */
        .header { 
            background: url('imagenes/bannerin.png') center/cover no-repeat;
            padding: clamp(35px, 8vw, 65px) 20px; 
            color: white; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 1000;
            /* AGREGADO: Transición suave para el escondite */
            transition: transform 0.4s ease-in-out; 
        }

        /* CLASE NUEVA PARA ESCONDER EL HEADER */
        .header.nav-up {
            transform: translateY(-100%);
        }

        /* PATRÓN DE CUADROS BLANCO Y NEGRO */
        .header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 16px;
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000), 
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .header-title h1 { 
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(22px, 6vw, 36px);
            text-transform: uppercase;
            color: #ff4500; 
            text-shadow: 3px 3px 0px #000; 
        }

        .header-right { display: flex; gap: 15px; align-items: center; }

        .btn-header { 
            text-decoration: none; 
            color: #000; 
            font-weight: bold; 
            padding: 10px 25px; 
            background: #fff; 
            border: 3px solid #000;
            border-radius: 25px; 
            transition: all 0.3s ease; 
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-header:hover { 
            background-color: #ff6b00; 
            color: white; 
            transform: translateY(-3px);
            box-shadow: 6px 6px 0px #000;
        }

        .cart-btn { 
            background: #fff; border: 3px solid #000; color: #000; 
            width: 48px; height: 48px; border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; text-decoration: none; font-size: 20px;
            box-shadow: 4px 4px 0px #000; transition: 0.3s;
        }
        .cart-btn:hover { background: #ff6b00; transform: scale(1.1); color: white; }

        .cart-badge { 
            position: absolute; top: -8px; right: -8px; 
            background-color: #ff3d00; color: #fff; border: 2px solid #000; 
            border-radius: 50%; padding: 2px; min-width: 22px; height: 22px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 2px 0px #000; z-index: 10;
        }

        /* TABS (BOTONES DE CATEGORÍA) */
        .tabs-container { 
            display: flex; 
            justify-content: center; 
            padding: 40px 15px 20px; 
            gap: 15px;
            flex-wrap: wrap;
        }

        .tab-btn { 
            padding: 12px 28px; 
            border: 3px solid #000; 
            background: white; 
            color: #000; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: 0.3s;
            font-size: 14px;
            box-shadow: 5px 5px 0px #000;
            text-transform: uppercase;
            font-family: 'Archivo Black', sans-serif;
        }

        .tab-btn:hover, .tab-btn.active { 
            background: #ff6b00; 
            color: white; 
            transform: translateY(-3px); 
            box-shadow: 7px 7px 0px #000;
        }

        /* GRID Y TARJETAS */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        
        .card { 
            background: white; 
            border-radius: 20px; 
            border: 3px solid #000; 
            overflow: hidden;
            box-shadow: 6px 6px 0px #000; 
            display: flex; 
            flex-direction: column; 
            transition: 0.3s; 
            opacity: 0; 
        }

        .card:hover { 
            transform: translateY(-10px); 
            box-shadow: 10px 10px 0px #ff6b00; 
        }

        .card-image { width: 100%; height: 210px; object-fit: cover; border-bottom: 3px solid #000; }
        
        .card-info { padding: 25px; flex-grow: 1; }
        .card-info h3 { 
            font-family: 'Archivo Black', sans-serif;
            font-size: 19px; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
        }
        .card-description { color: #666; font-size: 14px; line-height: 1.4; font-weight: 600; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 0 25px 25px; }
        .card-price { color: #ff6b00; font-size: 26px; font-weight: 900; text-shadow: 1.5px 1.5px 0px #000; }
        
        .add-btn { 
            background: #fff; 
            color: #000; 
            border: 3px solid #000; 
            padding: 12px 20px; 
            border-radius: 15px; 
            cursor: pointer; 
            font-weight: 900; 
            transition: 0.2s;
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            font-size: 12px;
        }

        .add-btn:hover { 
            background: #ff6b00; 
            color: white; 
            transform: scale(1.05); 
            box-shadow: 1px 1px 0px #000;
        }

        /* ANIMACIONES DE ENTRADA */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animar-entrada {
            animation: fadeInUp 0.8s ease-out forwards;
        }
    </style>
</head>
<body>

    <header class="header" id="mainHeader">
        <div class="header-title">
            <h1>FREDDY'S PIZZA</h1>
        </div>
        <div class="header-right">
            <a href="index.html" class="btn-header">Inicio</a>
            <a href="carrito.html" class="cart-btn">
                🛒<span id="cartBadge" class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <div class="tabs-container animar-entrada">
        <button class="tab-btn active" onclick="cargarCategoria('pizzas', this)">🍕 Pizzas</button>
        <button class="tab-btn" onclick="cargarCategoria('bebidas', this)">🥤 Bebidas</button>
        <button class="tab-btn" onclick="cargarCategoria('promos', this)">🎁 Promos</button>
    </div>

    <div class="container">
        <div class="grid-container" id="productos-render">
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const CART_KEY = 'pizzaCart';

        // LÓGICA PARA OCULTAR HEADER AL HACER SCROLL
        let lastScrollTop = 0;
        const header = document.getElementById('mainHeader');

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                // Si bajas: ocultar
                header.classList.add('nav-up');
            } else {
                // Si subes: mostrar
                header.classList.remove('nav-up');
            }
            lastScrollTop = scrollTop;
        });

        // FUNCIÓN CARGAR CATEGORÍA
        async function cargarCategoria(categoria, btn) {
            if (btn) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            const container = document.getElementById('productos-render');
            container.innerHTML = ""; 

            const { data: productos, error } = await supabaseClient
                .from('productos')
                .select('*')
                .eq('categoria', categoria);

            if (error) {
                console.error("Error cargando productos:", error);
                return;
            }

            productos.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = "card animar-entrada";
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <img src="${p.imagen_url}" class="card-image" style="${categoria === 'bebidas' ? 'object-fit: contain; background: #fff;' : ''}">
                    <div class="card-info">
                        <h3>${p.nombre}</h3>
                        <p class="card-description">${p.descripcion}</p>
                    </div>
                    <div class="card-footer">
                        <span class="card-price">$${p.precio.toFixed(2)}</span>
                        <button class="add-btn" onclick="addToCart('${p.nombre}', ${p.precio})">Agregar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // LÓGICA DEL CARRITO
        function addToCart(name, price) {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || {};
            cart[name] = cart[name] ? {...cart[name], quantity: cart[name].quantity + 1} : {name, price, quantity: 1};
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartBadge();
            
            const cartIcon = document.querySelector('.cart-btn');
            cartIcon.style.transform = "scale(1.3)";
            setTimeout(() => cartIcon.style.transform = "scale(1)", 200);
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || {};
            let total = Object.values(cart).reduce((s, i) => s + i.quantity, 0);
            const badge = document.getElementById('cartBadge');
            badge.style.display = total > 0 ? 'flex' : 'none';
            badge.textContent = total;
        }

        window.onload = () => {
            cargarCategoria('pizzas');
            updateCartBadge();
        };
    </script>
</body>
</html>
