<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdf2e9; color: #333; overflow-x: hidden; }
        
        /* HEADER */
        .header { 
            background: #fff; 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 4px solid #000;
            position: sticky; top: 0; z-index: 1000; 
        }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; transition: 0.3s; }
        .logo-text { font-family: 'Archivo Black', sans-serif; font-size: 22px; color: #ff4500; text-shadow: 2px 2px 0px #000; }

        .header-right { display: flex; gap: 15px; align-items: center; }

        .cart-btn { 
            background: #fff; border: 3px solid #000; color: #000; 
            width: 48px; height: 48px; border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; text-decoration: none; font-size: 20px;
            box-shadow: 3px 3px 0px #000; transition: 0.3s;
            overflow: hidden; /* Para que la foto no se salga del círculo */
        }
        .cart-btn:hover { background: #ff6b00; transform: scale(1.1); }
        .cart-btn img { width: 100%; height: 100%; object-fit: cover; }

        .cart-badge { 
            position: absolute; top: -8px; right: -8px; 
            background-color: #ff3d00; color: #fff; border: 2px solid #000; 
            border-radius: 50%; padding: 2px; min-width: 22px; height: 22px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 2px 0px #000; z-index: 10;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* HERO & GRID */
        .hero-swiper { width: 100%; min-height: 500px; border-bottom: 5px solid #000; background-image: url('imagenes/carrusel.png'); background-size: cover; background-position: center; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .slide-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; width: 100%; max-width: 1100px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 30px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.3); animation: fadeInUp 0.8s ease-out; }
        .slide-text h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(28px, 5vw, 55px); color: #fff; text-shadow: 3px 3px 0px #000; text-transform: uppercase; line-height: 1; margin-bottom: 15px; }
        .slide-text p { font-size: clamp(14px, 2vw, 18px); font-weight: 600; color: #fff; margin-bottom: 25px; line-height: 1.4; text-shadow: 1px 1px 5px rgba(0,0,0,0.7); }
        .slide-img { max-height: 350px; width: auto; max-width: 100%; border-radius: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 5px solid #fff; transition: 0.5s ease; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .section-title { font-family: 'Archivo Black', sans-serif; text-align: center; margin-bottom: 40px; font-size: clamp(24px, 5vw, 35px); text-transform: uppercase; text-shadow: 3px 3px 0px #ff6b00; color: #000; animation: fadeInUp 0.8s ease-out; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        
        .card { 
            background: white; border-radius: 20px; border: 3px solid #000; overflow: hidden; 
            box-shadow: 6px 6px 0px #000; transition: 0.3s; display: flex; flex-direction: column; 
            animation: fadeInUp 0.8s ease-out;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 10px 10px 0px #ff6b00; }
        .card-image { width: 100%; height: 230px; object-fit: cover; border-bottom: 3px solid #000; }
        .card-info { padding: 25px; flex-grow: 1; }
        .card-info h3 { font-family: 'Archivo Black', sans-serif; font-size: 20px; margin-bottom: 10px; text-transform: uppercase; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding: 0 25px 25px; }
        .card-price { color: #ff6b00; font-size: 26px; font-weight: 900; text-shadow: 1.5px 1.5px 0px #000; }
        
        .add-btn { 
            background: #fff; color: #000; border: 3px solid #000; padding: 12px 20px; 
            border-radius: 15px; cursor: pointer; font-weight: 900; transition: 0.2s; 
            box-shadow: 4px 4px 0px #000; text-transform: uppercase; font-size: 13px; 
        }
        .add-btn:hover { background: #ff6b00; color: #fff; transform: scale(1.05); }

        /* DROPDOWN */
        .user-dropdown { display: none; position: absolute; top: 60px; right: 0; background: white; border: 4px solid #000; box-shadow: 6px 6px 0px #000; width: 240px; padding: 15px; z-index: 2000; animation: fadeInUp 0.3s ease-out; }
        .user-dropdown.active { display: block; }

        .main-footer { background-color: #fff; border-top: 5px solid #000; padding: 40px 20px; margin-top: 50px; }
        .footer-grid { max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; text-align: center; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-container">
            <img src="imagenes/logo.png" alt="Freddy's Logo" class="logo-img">
            <span class="logo-text">FREDDY'S PIZZA</span>
        </a>
        <div class="header-right">
            <div style="position: relative;" id="userMenuContainer">
                <a href="login.html" class="cart-btn" id="userBtn">👤</a>
                
                <div class="user-dropdown" id="userDropdown">
                    <div id="userInfoDisplay" style="margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
                        <h4 id="userNameHeader" style="font-size:14px; color:#000;">Cargando...</h4>
                        <p id="userEmailHeader" style="font-size:11px; color:gray;"></p>
                    </div>
                    <p id="userRole" style="font-size:11px; font-weight:900; color:#ff6b00; text-transform:uppercase; margin-bottom:10px;"></p>
                    <div id="adminLinkContainer"></div>
                    <a href="perfil_cliente.html" style="display:block; text-decoration:none; color:#000; font-weight:bold; padding:8px 0;">Mi Perfil</a>
                    <button onclick="cerrarSesion()" style="border:none; background:none; color:#ff6b00; cursor:pointer; font-weight:900; text-transform:uppercase; padding-top:10px; width: 100%; text-align: left;">Cerrar Sesión</button>
                </div>
            </div>

            <a href="carrito.html" class="cart-btn">
                🛒<span id="cartBadge" class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <section class="swiper hero-swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="slide-container">
                    <div class="slide-text">
                        <h1>Pepperoni <br> Legendario</h1>
                        <p>Nuestra pizza estrella con pepperoni de corte grueso y una mezcla secreta de quesos derretidos.</p>
                        <a href="catalogo.html" class="add-btn" style="display: inline-block; text-decoration: none; padding: 15px 25px;">¡ORDENAR YA!</a>
                    </div>
                    <div class="slide-image-wrapper">
                        <img src="imagenes/pizza_pepe.png" class="slide-img" alt="Pizza Pepperoni">
                    </div>
                </div>
            </div>
        </div>
        <div class="swiper-button-next" style="color: #fff;"></div>
        <div class="swiper-button-prev" style="color: #fff;"></div>
        <div class="swiper-pagination"></div>
    </section>

    <div class="container">
        <h2 class="section-title">Especialidades</h2>
        <div class="grid-container" id="pizzasGrid">
            <div class="card">
                <img src="imagenes/pizza_pepe.png" class="card-image" alt="Pepperoni">
                <div class="card-info">
                    <h3>Pepperoni Premium</h3>
                    <p class="card-description">Nuestra pizza estrella con pepperoni de corte grueso y extra queso.</p>
                </div>
                <div class="card-footer">
                    <span class="card-price">$121.99</span>
                    <button class="add-btn" onclick="addToCart('Pepperoni Premium', 121.99, 'imagenes/pizza_pepe.png')">AGREGAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            updateCartBadge();
            new Swiper('.hero-swiper', {
                loop: true,
                autoplay: { delay: 5000 },
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            });
        });

        // LÓGICA DE AUTH CORREGIDA
        async function initAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const userBtn = document.getElementById('userBtn');
            const userDropdown = document.getElementById('userDropdown');

            if (user) {
                // Obtenemos los datos del perfil (Nombre y Foto)
                const { data: perfil } = await supabaseClient
                    .from('perfiles')
                    .select('rol, nombre, foto_url')
                    .eq('id', user.id)
                    .single();
                
                const rol = perfil ? perfil.rol : 'usuario';
                const nombre = (perfil && perfil.nombre) ? perfil.nombre : 'Usuario';
                const foto = (perfil && perfil.foto_url) ? perfil.foto_url : null;

                // Cambiar el icono del botón por la foto o la inicial
                userBtn.href = "javascript:void(0)";
                if (foto) {
                    userBtn.innerHTML = `<img src="${foto}" alt="Perfil">`;
                } else {
                    const inicial = user.email.charAt(0).toUpperCase();
                    userBtn.innerHTML = `<div style="width:100%; height:100%; background:#000; color:white; display:flex; align-items:center; justify-content:center; font-weight:900;">${inicial}</div>`;
                }

                userBtn.onclick = (e) => {
                    e.preventDefault();
                    userDropdown.classList.toggle('active');
                };

                // Actualizar textos del dropdown
                document.getElementById('userNameHeader').textContent = nombre;
                document.getElementById('userEmailHeader').textContent = user.email;
                document.getElementById('userRole').textContent = rol;

                if (rol === 'admin') {
                    document.getElementById('adminLinkContainer').innerHTML = `<a href="panelA.html" style="display:block; text-decoration:none; color:#ff6b00; font-weight:900; padding:8px 0; border-top: 1px solid #eee;">⚙️ PANEL ADMIN</a>`;
                }
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('pizzaCart')) || {};
            let total = Object.values(cart).reduce((s, i) => s + i.quantity, 0);
            const badge = document.getElementById('cartBadge');
            if (total > 0) {
                badge.style.display = 'flex';
                badge.textContent = total;
            }
        }

        function addToCart(name, price, img) {
            let cart = JSON.parse(localStorage.getItem('pizzaCart')) || {};
            cart[name] = cart[name] ? {...cart[name], quantity: cart[name].quantity + 1} : {name, price, image: img, quantity: 1};
            localStorage.setItem('pizzaCart', JSON.stringify(cart));
            updateCartBadge();
        }

        window.onclick = (e) => {
            if (!document.getElementById('userMenuContainer').contains(e.target)) {
                document.getElementById('userDropdown').classList.remove('active');
            }
        };
    </script>
</body>
</html>
