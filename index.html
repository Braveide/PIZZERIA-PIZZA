<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Menú</title>
    <style>
        /* RESET Y BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; color: #333; }
        
        #loader-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.3s ease, visibility 0.3s; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #ff3d00; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loader-wrapper.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        /* HEADER */
        .header { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { height: 40px; width: auto; }
        .logo-text { font-size: 22px; font-weight: bold; color: #ff4500; }
        .header-right { display: flex; gap: 10px; align-items: center; }
        
        .cart-btn { background: #ff4500; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative; }
        
        /* PESTAÑAS (TABS) */
        .tabs-container { display: flex; justify-content: center; gap: 15px; margin: 40px 0 20px; }
        .tab-btn { padding: 12px 25px; border: 2px solid #ff4500; background: white; color: #ff4500; font-weight: bold; border-radius: 30px; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: #ff4500; color: white; }
        .tab-btn:hover { background: #ff4500; color: white; }

        /* ESPECIALIDADES */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .grid-especialidades { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        /* TARJETAS - Animación de aparición */
        .card { 
            background: white; border-radius: 20px; overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center;
            padding-bottom: 25px; border: 1px solid #eee; transition: 0.3s;
            display: block; /* Por defecto se ven */
        }
        .card.hidden { display: none; } /* Clase para ocultar */

        .card-image { width: 100%; height: 200px; object-fit: cover; }
        .card-price { font-size: 22px; font-weight: bold; color: #ff4500; }

        /* DROPDOWN USUARIO */
        .user-dropdown { display: none; position: absolute; top: 55px; right: 0; background: white; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); width: 240px; padding: 20px; z-index: 2000; text-align: center; }
        .user-dropdown.active { display: block; }
        .user-dropdown img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #ff4500; }
    </style>
</head>
<body>

    <div id="loader-wrapper"><div class="loader"></div></div>

    <header class="header">
        <a href="index.html" class="logo-container">
            <img src="imagenes/logo.png" alt="Logo" class="logo-img">
            <span class="logo-text">FREDDY'S PIZZA</span>
        </a>
        <div class="header-right">
            <div style="position: relative;" id="userMenuContainer">
                <a href="login.html" class="cart-btn" id="userBtn">👤</a>
                <div class="user-dropdown" id="userDropdown">
                    <img id="userImg" src="https://via.placeholder.com/70" alt="Perfil">
                    <h4 id="userName">Cargando...</h4>
                    <p id="userEmail" style="font-size:12px; color:#777;">correo@ejemplo.com</p>
                    <hr style="margin:10px 0; border:0; border-top:1px solid #eee;">
                    <button onclick="cerrarSesion()" style="border:none; background:none; color:#d93025; font-weight:bold; cursor:pointer;">Cerrar Sesión</button>
                </div>
            </div>
            <a href="carrito.html" class="cart-btn">🛒<span id="cartBadge" class="cart-badge" style="display: none;">0</span></a>
        </div>
    </header>

    <div class="container">
        <div class="tabs-container">
            <button class="tab-btn active" onclick="filtrar('todas')">Todas</button>
            <button class="tab-btn" onclick="filtrar('pizzas')">Pizzas</button>
            <button class="tab-btn" onclick="filtrar('bebidas')">Bebidas</button>
            <button class="tab-btn" onclick="filtrar('promos')">Promociones</button>
        </div>

        <div class="grid-especialidades" id="menu-grid">
            <div class="card" data-categoria="pizzas">
                <img src="imagenes/pizza_pepe.png" class="card-image">
                <h3>Pepperoni Premium</h3>
                <p>Salsa de tomate y mozzarella.</p>
                <span class="card-price">$21.99</span>
            </div>

            <div class="card" data-categoria="bebidas">
                <img src="imagenes/cerveza.jpg" class="card-image">
                <h3>Cerveza Fría</h3>
                <p>La compañía perfecta.</p>
                <span class="card-price">$5.00</span>
            </div>

            <div class="card" data-categoria="promos">
                <img src="imagenes/bbq.jpg" class="card-image">
                <h3>Paquete Familiar</h3>
                <p>2 Pizzas + Bebida grande.</p>
                <span class="card-price">$45.00</span>
            </div>
        </div>
    </div>

    <script>
        // FUNCIÓN PARA FILTRAR PESTAÑAS
        function filtrar(categoria) {
            // Actualizar botones
            const botones = document.querySelectorAll('.tab-btn');
            botones.forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Filtrar tarjetas
            const tarjetas = document.querySelectorAll('.card');
            tarjetas.forEach(card => {
                if (categoria === 'todas') {
                    card.classList.remove('hidden');
                } else {
                    if (card.getAttribute('data-categoria') === categoria) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                }
            });
        }

        // LÓGICA DE USUARIO (Mantenemos lo de las fotos .jpeg)
        (function initApp() {
            const userDataJSON = localStorage.getItem('userPizzaApp');
            if (userDataJSON) {
                let user = JSON.parse(userDataJSON);
                if (user.rol === 'admin') user.picture = 'imagenes/admin.jpeg';
                else if (user.rol === 'vendedor') user.picture = 'imagenes/vendor.jpeg';

                const userBtn = document.getElementById('userBtn');
                if (user.picture) {
                    document.getElementById('userImg').src = user.picture;
                    userBtn.innerHTML = `<img src="${user.picture}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                }
                document.getElementById('userName').textContent = user.name || user.rol;
            }
        })();

        window.addEventListener('load', () => {
            setTimeout(() => document.getElementById('loader-wrapper').classList.add('hidden'), 200);
        });

        function cerrarSesion() {
            localStorage.removeItem('userPizzaApp');
            window.location.reload();
        }
    </script>
</body>
</html>
