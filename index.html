<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Freddy's Pizza - Original Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ESTILO EXACTO DE TU CAPTURA */
        body { font-family: 'Arial', sans-serif; background-color: #f5f5dc; margin: 0; padding: 20px; }
        
        .chat-container {
            position: fixed; bottom: 90px; right: 20px;
            width: 350px; height: 500px;
            background: white; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; overflow: hidden;
            border: 1px solid #ddd;
        }

        .chat-header { background: #000; color: white; padding: 15px; font-weight: bold; text-align: center; }
        
        #music-status { background: #d4edda; color: #155724; font-size: 12px; padding: 5px; text-align: center; display: none; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }

        /* Tus burbujas originales */
        .message { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; }
        .bot { background: #f1f1f1; align-self: flex-start; color: #333; }
        .user { background: #ff6600; align-self: flex-end; color: white; }

        .chat-input { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 8px 15px; outline: none; }
        
        .btn-pizza { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; cursor: pointer; }

        /* Los botones de abajo que tenías */
        .quick-actions { display: flex; justify-content: space-around; padding: 10px; background: #fafafa; border-top: 1px solid #eee; }
        .quick-actions button { background: none; border: none; font-size: 12px; cursor: pointer; color: #666; }
    </style>
</head>
<body>

    <div id="chat-window" class="chat-container" style="display: none;">
        <div class="chat-header">FREDDY'S PIZZA</div>
        <div id="music-status">🎵 Música de ambiente activada</div>
        <div class="chat-messages" id="chatMsgs">
            <div class="message bot">¡Hola! Soy el asistente de Freddy's. ¿Con quién tengo el gusto de hablar?</div>
        </div>
        
        <div class="quick-actions">
            <button onclick="enviarRapido('Menú')">🍕 Menú</button>
            <button onclick="enviarRapido('Soporte')">🛠️ Soporte</button>
            <button onclick="enviarRapido('La más barata')">💰 Ofertas</button>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Escribe un mensaje...">
            <button onclick="handleSendMessage()" style="background:none; border:none; font-size:20px; cursor:pointer;">➡️</button>
        </div>
    </div>

    <img src="https://cdn-icons-png.flaticon.com/512/1404/1404945.png" class="btn-pizza" onclick="toggleChat()">

    <audio id="audioFnaf" loop>
        <source src="https://www.myinstants.com/media/sounds/fnaf-1-music-box.mp3" type="audio/mpeg">
    </audio>

    <script>
        const _URL = "TU_SUPABASE_URL";
        const _KEY = "TU_SUPABASE_KEY";
        const supabase = supabase.createClient(_URL, _KEY);

        let user_name = "";

        function toggleChat() {
            const chat = document.getElementById('chat-window');
            const audio = document.getElementById('audioFnaf');
            const isHidden = chat.style.display === 'none';
            
            chat.style.display = isHidden ? 'flex' : 'none';
            
            if (isHidden) {
                audio.play().then(() => {
                    document.getElementById('music-status').style.display = 'block';
                }).catch(() => console.log("Clic necesario para audio"));
            }
        }

        async function handleSendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = "";

            let reply = "";

            // Lógica inteligente sin romper el diseño
            if (!user_name) {
                user_name = text;
                reply = `¡Mucho gusto, **${user_name}**! ¿Qué te gustaría saber hoy?`;
            } else if (text.toLowerCase().includes("barata")) {
                const { data } = await supabase.from('productos').select('*').order('precio', {ascending: true}).limit(1);
                reply = data.length > 0 ? `La más económica es la ${data[0].nombre} a $${data[0].precio}` : "No tengo precios ahora.";
            } else if (text.toLowerCase().includes("soporte")) {
                reply = `Claro ${user_name}, aquí tienes el botón de soporte: <br><button onclick="alert('Llamando a soporte...')">Contactar</button>`;
            } else {
                reply = `${user_name}, ¿quieres que te cuente un chiste o prefieres ver el menú?`;
            }

            setTimeout(() => addMsg(reply, 'bot'), 600);
        }

        function enviarRapido(txt) {
            document.getElementById('userInput').value = txt;
            handleSendMessage();
        }

        function addMsg(txt, type) {
            const box = document.getElementById('chatMsgs');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = txt;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
