<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Freddy's Pizza - Bot Inteligente</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Mantenemos tu estilo original de las capturas */
        :root { --fnaf-orange: #ff6600; --fnaf-bg: #f5f5dc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--fnaf-bg); margin: 0; }
        
        /* Estilo del Chat que ya tenías */
        #chat-window { 
            position: fixed; bottom: 80px; right: 20px; 
            width: 350px; height: 450px; 
            background: white; border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; overflow: hidden;
            border: 2px solid black;
        }
        .chat-header { background: black; color: white; padding: 10px; font-weight: bold; display: flex; justify-content: space-between; }
        #chat-messages { flex: 1; padding: 10px; overflow-y: auto; background: #fff; display: flex; flex-direction: column; gap: 8px; }
        
        /* Burbujas de mensaje estilo Vercel */
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .bot-msg { background: #f1f1f1; align-self: flex-start; border: 1px solid #ccc; }
        .user-msg { background: var(--fnaf-orange); color: white; align-self: flex-end; }

        .input-area { border-top: 1px solid #eee; padding: 10px; display: flex; }
        input { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 8px 15px; outline: none; }
        .send-btn { background: var(--fnaf-orange); border: none; color: white; border-radius: 50%; width: 35px; margin-left: 5px; cursor: pointer; }

        /* El botón flotante de la pizza */
        .pizza-floater { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; cursor: pointer; transition: transform 0.3s; }
        .pizza-floater:hover { transform: scale(1.1); }

        /* Banner de música activa */
        #music-banner { background: #94ad4b; color: white; text-align: center; font-size: 10px; padding: 2px; display: none; }
    </style>
</head>
<body>

    <img src="https://cdn-icons-png.flaticon.com/512/1404/1404945.png" class="pizza-floater" onclick="toggleChat()">

    <div id="chat-window" style="display: none;">
        <div class="chat-header">
            <span>FREDDY'S BOT 🤖</span>
            <span style="cursor:pointer" onclick="toggleChat()">✖</span>
        </div>
        <div id="music-banner">🔊 MÚSICA DE FNAF ACTIVA</div>
        <div id="chat-messages">
            <div class="msg bot-msg">¡Hola! Bienvenido a Freddy's. ¿Cómo te llamas para darte una mejor atención?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu duda...">
            <button class="send-btn" onclick="handleSend()">></button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.myinstants.com/media/sounds/fnaf-1-music-box.mp3" type="audio/mpeg">
    </audio>

    <script>
        // CONFIGURACIÓN DE TU SUPABASE
        const _URL = "TU_SUPABASE_URL";
        const _KEY = "TU_SUPABASE_KEY";
        const supabase = supabase.createClient(_URL, _KEY);

        let nombreUsuario = "";

        function toggleChat() {
            const chat = document.getElementById('chat-window');
            chat.style.display = chat.style.display === 'none' ? 'flex' : 'none';
            // Iniciar música al abrir por primera vez
            const music = document.getElementById('bg-music');
            music.play().then(() => {
                document.getElementById('music-banner').style.display = 'block';
            }).catch(e => console.log("Esperando interacción"));
        }

        async function handleSend() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if(!texto) return;

            renderMsg(texto, 'user-msg');
            input.value = "";

            let respuesta = "";

            // 1. Lógica para capturar el nombre
            if(!nombreUsuario) {
                nombreUsuario = texto;
                respuesta = `¡Un placer, **${nombreUsuario}**! ¿Qué te gustaría ordenar? Puedes preguntar por las pizzas, bebidas o la más barata.`;
            } 
            // 2. Lógica de Soporte con botón
            else if(texto.toLowerCase().includes("soporte")) {
                respuesta = `${nombreUsuario}, te he generado un botón de soporte. <br><button onclick="window.open('https://wa.me/tu_numero')" style="background:blue; color:white; border:none; padding:5px; border-radius:5px; margin-top:5px; cursor:pointer;">Hablar con Humano</button>`;
            }
            // 3. Lógica de BD: Pizza más barata
            else if(texto.toLowerCase().includes("barata") || texto.toLowerCase().includes("económica")) {
                const { data } = await supabase.from('productos').select('*').eq('categoria', 'pizzas').order('precio', {ascending: true}).limit(1);
                if(data.length > 0) {
                    respuesta = `Para ti ${nombreUsuario}, la opción más económica es la **${data[0].nombre}** a solo **$${data[0].precio}**.`;
                }
            }
            // 4. Lógica de Menú
            else if(texto.toLowerCase().includes("pizzas") || texto.toLowerCase().includes("menú")) {
                const { data } = await supabase.from('productos').select('nombre').eq('categoria', 'pizzas');
                const lista = data.map(p => p.nombre).join(", ");
                respuesta = `Claro ${nombreUsuario}, nuestras pizzas son: ${lista}.`;
            }
            // 5. Fallback (Chiste/Error)
            else {
                respuesta = `No te entendí muy bien, ${nombreUsuario}... 😅 pero si tienes hambre, ¡pide una pizza!`;
            }

            setTimeout(() => renderMsg(respuesta, 'bot-msg'), 500);
        }

        function renderMsg(text, tipo) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerHTML = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
