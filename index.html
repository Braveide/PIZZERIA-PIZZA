<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* RESET Y BASE MANTENIDOS */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; color: #333; overflow-x: hidden; }
        
        /* LOADER MANTENIDO */
        #loader-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #ff4500; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.7s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loader-wrapper.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.15s ease; }
        
        /* HEADER */
        .header { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-img { height: 32px; width: auto; }
        .logo-text { font-size: 18px; font-weight: bold; color: #ff4500; letter-spacing: -0.5px; }

        .header-right { display: flex; gap: 8px; align-items: center; }
        .btn-header { text-decoration: none; color: #333; font-weight: 600; padding: 8px 10px; border-radius: 20px; transition: background 0.3s; font-size: 13px; }
        
        .cart-btn { background: #ffffff; border: 2px solid #1a1a1a; color: #1a1a1a; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative; transition: all 0.2s ease; font-size: 16px; overflow: hidden; }

        .cart-badge { position: absolute; top: -5px; right: -5px; background-color: #ff4500; color: white; border-radius: 50%; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 2px solid #fff; }

        /* HERO MANTENIDO */
        .hero { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('imagenes/baner.jpg') center/cover no-repeat; padding: 80px 20px; text-align: center; color: white; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .btn-catalogo { display: inline-block; padding: 12px 25px; background: white; color: #ff4500; text-decoration: none; border-radius: 30px; font-weight: bold; margin-top: 15px; }

        /* GRID MANTENIDO */
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 15px; }
        .grid-especialidades { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; padding-bottom: 20px; border: 1px solid #eee; }
        .card-image { width: 100%; height: 180px; object-fit: cover; }

        /* DROPDOWN */
        .user-dropdown { display: none; position: absolute; top: 45px; right: 0; background: white; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); width: 220px; padding: 15px; z-index: 2000; border: 1px solid #eee; }
        .user-dropdown.active { display: block; }
        .user-dropdown a { display: block; text-decoration: none; color: #333; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .user-dropdown a:hover { color: #ff4500; }

        @media (max-width: 480px) { .logo-text { display: none; } .btn-header { display: none; } }
    </style>
</head>
<body>

    <div id="loader-wrapper"><div class="loader"></div></div>

    <header class="header">
        <a href="index.html" class="logo-container">
            <img src="imagenes/logo.png" alt="Logo" class="logo-img">
            <span class="logo-text">FREDDY'S PIZZA</span>
        </a>
        <div class="header-right">
            <a href="contacto.html" class="btn-header">Nosotros</a>
            <a href="Conta.html" class="btn-header">Contacto</a>
            
            <div style="position: relative;" id="userMenuContainer">
                <a href="login.html" class="cart-btn" id="userBtn">👤</a>
                <div class="user-dropdown" id="userDropdown">
                    <h4 id="userName" style="font-size:14px; color:#333; font-weight: bold; margin-bottom: 2px;">Cargando...</h4>
                    <p id="userEmail" style="font-size:11px; color:#999; word-break: break-all; margin-bottom: 8px;">Email</p>
                    <p id="userRole" style="font-size:10px; font-weight:bold; color:#ff4500; margin-bottom:10px; letter-spacing: 1px;"></p>
                    <div id="adminLinkContainer"></div>
                    <a href="perfil_cliente.html">Mi Perfil</a>
                    <button onclick="cerrarSesion()" style="border:none; background:none; color:#ff4500; font-weight:bold; cursor:pointer; width: 100%; text-align:left; font-size:13px; margin-top:10px;">Cerrar Sesión</button>
                </div>
            </div>

            <a href="carrito.html" class="cart-btn">🛒<span id="cartBadge" class="cart-badge" style="display: none;">0</span></a>
        </div>
    </header>

    <section class="hero">
        <h1>Las mejores pizzas de la ciudad</h1>
        <p>Ingredientes frescos, masa artesanal y el sabor que te encanta.</p>
        <a href="catalogo.html" class="btn-catalogo">Ver Menú</a>
    </section>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader-wrapper');
            setTimeout(() => { loader.classList.add('hidden'); }, 100);
            initAuth();
        });

        async function initAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            const userBtn = document.getElementById('userBtn');
            const userDropdown = document.getElementById('userDropdown');
            const userNameDisplay = document.getElementById('userName');
            const userEmailHeader = document.getElementById('userEmail');
            const userRoleHeader = document.getElementById('userRole');
            const adminLinkContainer = document.getElementById('adminLinkContainer');

            if (user) {
                // OBTENER PERFIL COMPLETO (Nombre, Rol y Color)
                const { data: perfil } = await supabaseClient
                    .from('perfiles')
                    .select('nombre, rol, color')
                    .eq('id', user.id)
                    .single();

                const nombreUsuario = (perfil && perfil.nombre) ? perfil.nombre : 'Usuario';
                const rol = (perfil && perfil.rol) ? perfil.rol : 'usuario';
                const colorUsuario = (perfil && perfil.color) ? perfil.color : '#ff4500'; // Naranja por defecto si no hay color

                // 1. Configurar el Círculo de Perfil con el Color de la DB
                userBtn.href = "javascript:void(0)";
                const inicial = nombreUsuario.charAt(0).toUpperCase();
                userBtn.innerHTML = `<div style="width:100%; height:100%; background:${colorUsuario}; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:18px;">${inicial}</div>`;
                userBtn.style.border = "none"; // Quitamos el borde negro para que luzca el color
                
                userBtn.onclick = (e) => {
                    e.preventDefault();
                    userDropdown.classList.toggle('active');
                };

                // 2. Llenar datos del Dropdown
                userNameDisplay.textContent = nombreUsuario;
                userEmailHeader.textContent = user.email;
                userRoleHeader.textContent = rol.toUpperCase();

                if (rol === 'admin') {
                    adminLinkContainer.innerHTML = `<a href="panelA.html" style="color:#ff4500; font-weight:bold;">⚙️ Panel Admin</a>`;
                }

            } else {
                userBtn.href = "login.html";
                userBtn.innerHTML = "👤";
                userBtn.style.background = "white";
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        window.onclick = (e) => {
            if (!document.getElementById('userMenuContainer').contains(e.target)) {
                document.getElementById('userDropdown').classList.remove('active');
            }
        };

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('pizzaCart')) || {};
            let total = 0;
            for (let i in cart) total += cart[i].quantity;
            const badge = document.getElementById('cartBadge');
            if (total > 0) { badge.textContent = total; badge.style.display = 'flex'; }
        }
        updateCartBadge();
    </script>
</body>
</html>
