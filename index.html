<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Freddy's Pizza - Chatbot Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Mantenemos tu estilo original */
        :root { --fnaf-orange: #ff6600; --fnaf-dark: #222; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5dc; }

        .pizza-floater { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; cursor: pointer; z-index: 1000; transition: 0.3s; }
        .pizza-floater:hover { transform: scale(1.1); }

        .chat-window {
            position: fixed; bottom: 90px; right: 20px; width: 350px; height: 500px;
            background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none; flex-direction: column; overflow: hidden; z-index: 1000; border: 1px solid #ccc;
        }

        .chat-header { background: black; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }

        .msg { padding: 10px 15px; border-radius: 15px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .bot { background: #f1f1f1; align-self: flex-start; color: #333; }
        .user { background: var(--fnaf-orange); color: white; align-self: flex-end; }

        /* Botones de acción rápida dentro del chat */
        .btn-group { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .action-btn { background: #eee; border: 1px solid #ddd; padding: 5px 10px; border-radius: 10px; cursor: pointer; font-size: 12px; }
        .action-btn:hover { background: var(--fnaf-orange); color: white; }

        .chat-input { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 5px; }
        input { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 8px 15px; outline: none; }
        
        .trash-btn { background: none; border: none; cursor: pointer; font-size: 18px; filter: grayscale(1); }
    </style>
</head>
<body>

    <img src="https://cdn-icons-png.flaticon.com/512/1404/1404945.png" class="pizza-floater" onclick="toggleChat()">

    <div id="chatWindow" class="chat-window">
        <div class="chat-header">
            <span>FREDDY'S BOT 🤖</span>
            <button class="trash-btn" onclick="limpiarChat()" title="Borrar conversación">🗑️</button>
        </div>
        
        <div id="chatMessages" class="chat-messages">
            </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Escribe aquí...">
            <button onclick="handleSend()" style="background:none; border:none; cursor:pointer; font-size:20px;">➡️</button>
        </div>
    </div>

    <audio id="fnafMusic" loop>
        <source src="https://www.myinstants.com/media/sounds/fnaf-1-music-box.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. Configuración de Conexión (Asegúrate de poner tus credenciales)
        const _URL = "TU_SUPABASE_URL";
        const _KEY = "TU_SUPABASE_KEY";
        const supabase = supabase.createClient(_URL, _KEY);

        let userName = sessionStorage.getItem('chat_user') || "";

        // Inicializar chat
        window.onload = () => {
            if(!userName) {
                addMessage("¡Hola! Soy Fazbot. ¿Cómo te llamas para poder atenderte?", 'bot');
            } else {
                addMessage(`¡Hola de nuevo, ${userName}! ¿En qué puedo ayudarte?`, 'bot');
                mostrarBotones();
            }
        };

        function toggleChat() {
            const chat = document.getElementById('chatWindow');
            const audio = document.getElementById('fnafMusic');
            const isOpening = chat.style.display === 'none' || chat.style.display === '';
            
            chat.style.display = isOpening ? 'flex' : 'none';
            
            if(isOpening) {
                audio.play().catch(() => console.log("Clic requerido para audio"));
            }
        }

        async function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            addMessage(text, 'user');
            input.value = "";

            // Lógica de Inteligencia
            if(!userName) {
                userName = text;
                sessionStorage.setItem('chat_user', userName);
                addMessage(`¡Mucho gusto, ${userName}!`, 'bot');
                mostrarBotones();
                return;
            }

            const lowerText = text.toLowerCase();

            // Búsqueda en Base de Datos para "Lo más barato"
            if(lowerText.includes("barata") || lowerText.includes("precio")) {
                const { data } = await supabase.from('productos').select('*').order('precio', {ascending: true}).limit(1);
                if(data && data.length > 0) {
                    addMessage(`Para ti ${userName}, la pizza más barata es la ${data[0].nombre} a solo $${data[0].precio}.`, 'bot');
                } else {
                    addMessage("No pude acceder al menú ahora, pero intenta con los botones.", 'bot');
                }
            } 
            // Soporte o Fallas
            else if(lowerText.includes("falla") || lowerText.includes("soporte") || lowerText.includes("ayuda")) {
                addMessage(`${userName}, te redirijo a soporte técnico.`, 'bot');
                setTimeout(() => window.location.href = "/soporte.html", 1500);
            }
            // Error de escritura / No entiende
            else {
                addMessage(`Lo siento ${userName}, no entendí eso. ¿Podrías intentar con una de estas opciones?`, 'bot');
                mostrarBotones();
            }
        }

        function mostrarBotones() {
            const btnHtml = `
                <div class="btn-group">
                    <button class="action-btn" onclick="window.location.href='/menu.html'">🍕 Ver Menú</button>
                    <button class="action-btn" onclick="window.location.href='/horarios.html'">⏰ Horarios</button>
                    <button class="action-btn" onclick="window.location.href='/contacto.html'">📞 Contáctanos</button>
                    <button class="action-btn" onclick="addMessage('Reportando falla...', 'user'); window.location.href='/soporte.html'">⚠️ Reportar Falla</button>
                </div>
            `;
            addMessage(btnHtml, 'bot');
        }

        function addMessage(txt, side) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg ${side}`;
            div.innerHTML = txt;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function limpiarChat() {
            sessionStorage.removeItem('chat_user');
            location.reload();
        }

        // 4. Borrar al salir (Cerrar pestaña)
        window.onbeforeunload = () => {
            sessionStorage.removeItem('chat_user');
        };
    </script>
</body>
</html>
