<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        :root { --freddy-orange: #ff6b00; --freddy-dark: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #fdf2e9; overflow-x: hidden; }

        /* HEADER */
        .header { 
            background: #fff; padding: 15px 25px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 4px solid #000; position: sticky; top: 0; z-index: 1000; 
        }
        .logo-text { font-family: 'Archivo Black', sans-serif; font-size: 22px; color: #ff4500; text-shadow: 2px 2px 0px #000; text-decoration: none; }

        .header-right { display: flex; gap: 15px; align-items: center; }

        /* BOTÓN DE PERFIL */
        .user-btn-circle { 
            width: 48px; height: 48px; border-radius: 50%; border: 3px solid #000; 
            cursor: pointer; overflow: hidden; background: #fff; transition: 0.3s;
            box-shadow: 3px 3px 0px #000; display: flex; align-items: center; justify-content: center;
        }
        .user-btn-circle:hover { transform: scale(1.1); border-color: var(--freddy-orange); }
        .user-btn-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* PANEL LATERAL (SIDEBAR DE USUARIO) */
        .user-sidebar {
            position: fixed; top: 0; right: -350px; width: 320px; height: 100vh;
            background: #fff; z-index: 2000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 5px solid #000; padding: 40px 25px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: -10px 0px 30px rgba(0,0,0,0.1);
        }
        .user-sidebar.active { right: 0; }

        .close-sidebar { position: absolute; top: 15px; left: 15px; cursor: pointer; font-size: 24px; font-weight: bold; }

        .sidebar-photo {
            width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--freddy-orange);
            margin-bottom: 20px; object-fit: cover; box-shadow: 5px 5px 0px #000;
        }

        .sidebar-info { text-align: center; margin-bottom: 30px; }
        .sidebar-info h3 { font-family: 'Archivo Black', sans-serif; font-size: 20px; margin-bottom: 5px; }
        .sidebar-info p { color: gray; font-size: 14px; }
        .role-badge { 
            background: #000; color: #fff; padding: 4px 12px; border-radius: 20px; 
            font-size: 10px; font-weight: 800; text-transform: uppercase; margin-top: 10px; display: inline-block;
        }

        /* BOTONES DEL PANEL */
        .sidebar-links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .s-link {
            text-decoration: none; color: #000; font-weight: 800; padding: 15px;
            border: 3px solid #000; border-radius: 15px; text-align: center;
            transition: 0.2s; box-shadow: 4px 4px 0px #000; text-transform: uppercase;
        }
        .s-link:hover { background: var(--freddy-orange); color: #fff; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
        
        .btn-logout { 
            margin-top: auto; color: #ff3d00; font-weight: 900; cursor: pointer; 
            border: none; background: none; text-transform: uppercase; border-bottom: 2px solid transparent;
        }
        .btn-logout:hover { border-color: #ff3d00; }

        /* OVERLAY (Fondo oscuro) */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 1999; backdrop-filter: blur(3px); }
        .overlay.active { display: block; }

        /* Resto de tus estilos se mantienen... */
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-container" style="text-decoration:none">
            <span class="logo-text">FREDDY'S PIZZA</span>
        </a>
        <div class="header-right">
            <div class="user-btn-circle" id="openUserBtn">
                <span id="userInitial">👤</span>
            </div>

            <a href="carrito.html" class="cart-btn" style="text-decoration:none; font-size: 24px;">🛒</a>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>
    <div class="user-sidebar" id="userSidebar">
        <span class="close-sidebar" id="closeSidebar">×</span>
        
        <img src="https://via.placeholder.com/120" id="sidePhoto" class="sidebar-photo">
        
        <div class="sidebar-info">
            <h3 id="sideName">Cargando...</h3>
            <p id="sideEmail">email@ejemplo.com</p>
            <span id="sideRole" class="role-badge">USUARIO</span>
        </div>

        <div class="sidebar-links">
            <div id="adminLinkArea"></div> <a href="perfil_cliente.html" class="s-link">👤 Mi Perfil</a>
            <a href="mis_pedidos.html" class="s-link">📦 Mis Pedidos</a>
        </div>

        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión Segura</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const openBtn = document.getElementById('openUserBtn');
        const closeBtn = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('userSidebar');
        const overlay = document.getElementById('overlay');

        // Abrir y cerrar panel
        openBtn.onclick = () => { 
            sidebar.classList.add('active'); 
            overlay.classList.add('active');
        };
        closeBtn.onclick = () => { 
            sidebar.classList.remove('active'); 
            overlay.classList.remove('active');
        };
        overlay.onclick = () => closeBtn.onclick();

        async function initAuth() {
            const { data: { user } } = await _supabase.auth.getUser();

            if (user) {
                const { data: perfil } = await _supabase.from('perfiles').select('*').eq('id', user.id).single();
                
                const nombre = perfil?.nombre || 'Usuario Freddy';
                const foto = perfil?.foto_url || null;
                const rol = perfil?.rol || 'usuario';

                // 1. Actualizar el botoncito del Header
                if (foto) {
                    openBtn.innerHTML = `<img src="${foto}">`;
                } else {
                    document.getElementById('userInitial').innerText = user.email.charAt(0).toUpperCase();
                }

                // 2. Llenar el Panel Lateral
                document.getElementById('sideName').innerText = nombre;
                document.getElementById('sideEmail').innerText = user.email;
                document.getElementById('sideRole').innerText = rol;
                if (foto) document.getElementById('sidePhoto').src = foto;

                // 3. Si es Admin, mostrar botón especial
                if (rol === 'admin') {
                    document.getElementById('adminLinkArea').innerHTML = `
                        <a href="panelA.html" class="s-link" style="background:#000; color:#fff; border-color:#000">⚙️ Panel Admin</a>
                    `;
                }
            } else {
                // Si no hay usuario, el botón manda a login
                openBtn.onclick = () => window.location.href = 'login.html';
            }
        }

        async function cerrarSesion() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        initAuth();
    </script>
</body>
</html>
