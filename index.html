<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freddy Fazbear's Pizza - Bot Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --pizzared: #8b0000; --fnafgold: #dbb400; }
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Courier, monospace; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #chat-container { width: 90%; max-width: 500px; background: #2a2a2a; border: 4px solid var(--pizzared); border-radius: 10px; margin-top: 20px; display: flex; flex-direction: column; height: 500px; box-shadow: 0 0 20px rgba(139, 0, 0, 0.5); }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px; border-radius: 8px; max-width: 80%; }
        .bot { background: #444; border-left: 4px solid var(--fnafgold); align-self: flex-start; }
        .user { background: var(--pizzared); align-self: flex-end; }

        #input-area { display: flex; padding: 10px; border-top: 1px solid #444; }
        input { flex: 1; padding: 10px; border: none; border-radius: 5px; background: #333; color: white; outline: none; }
        button { padding: 10px 15px; margin-left: 5px; background: var(--fnafgold); border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
        
        #soporte-btn { background: #0066cc; color: white; margin-top: 5px; width: 100%; border-radius: 5px; border: none; padding: 8px; cursor: pointer; }
    </style>
</head>
<body onclick="iniciarMusica()">

    <h1>Freddy's Pizza Hub</h1>
    <p id="welcome-text">Iniciando sistema...</p>

    <div id="chat-container">
        <div id="messages">
            <div class="msg bot">¡Hola! Soy FazBot. ¿Cómo te llamas para poder atenderte mejor?</div>
        </div>
        <div id="input-area">
            <input type="text" id="userInput" placeholder="Escribe aquí..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <audio id="fnafMusic" loop>
        <source src="https://www.myinstants.com/media/sounds/fnaf-1-music-box.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. CONFIGURACIÓN SUPABASE (Reemplaza con tus llaves reales)
        const SUPABASE_URL = 'TU_URL_DE_SUPABASE';
        const SUPABASE_KEY = 'TU_KEY_DE_SUPABASE';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userName = "";
        let musicStarted = false;

        // 2. ACTIVAR MÚSICA (Solo tras interacción del usuario)
        function iniciarMusica() {
            if (!musicStarted) {
                const audio = document.getElementById('fnafMusic');
                audio.play();
                musicStarted = true;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';

            // Lógica del Bot
            let response = "";

            // A. Registrar nombre si no existe
            if (!userName) {
                userName = text;
                response = `¡Mucho gusto, **${userName}**! ¿En qué puedo ayudarte hoy? Puedes preguntar por el menú, la pizza más barata o pedir soporte.`;
                document.getElementById('welcome-text').innerText = `Usuario activo: ${userName}`;
            } 
            // B. Lógica de Soporte
            else if (text.toLowerCase().includes("soporte") || text.toLowerCase().includes("ayuda")) {
                response = `Entendido ${userName}, te he generado un botón de contacto directo abajo.`;
                addSoporteBtn();
            }
            // C. Lógica de Pizza más barata (Consulta BD)
            else if (text.toLowerCase().includes("barata") || text.toLowerCase().includes("económica")) {
                const { data } = await supabase.from('productos').select('*').eq('categoria', 'pizzas').order('precio', { ascending: true }).limit(1);
                if (data && data.length > 0) {
                    response = `¡Oferta especial para ti, ${userName}! La pizza más barata es la **${data[0].nombre}** a tan solo **$${data[0].precio}**.`;
                } else {
                    response = "Lo siento, no pude acceder a los precios ahora mismo.";
                }
            }
            // D. Consulta de Menú
            else if (text.toLowerCase().includes("pizzas") || text.toLowerCase().includes("menú")) {
                const { data } = await supabase.from('productos').select('nombre').eq('categoria', 'pizzas');
                const lista = data.map(p => p.nombre).join(", ");
                response = `Claro ${userName}, tenemos: ${lista}. ¿Cuál te gustaría?`;
            }
            // E. Fallback (Humor Freddy)
            else {
                response = `${userName}, no entiendo eso, pero recuerda: "The show must go on". ¡Prueba preguntando por el menú!`;
            }

            setTimeout(() => addMessage(response, 'bot'), 600);
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerHTML = text;
            document.getElementById('messages').appendChild(msgDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function addSoporteBtn() {
            const btn = document.createElement('button');
            btn.id = "soporte-btn";
            btn.innerText = "Click aquí para Soporte Técnico";
            btn.onclick = () => window.open('https://wa.me/TUNUMERO', '_blank');
            document.getElementById('messages').appendChild(btn);
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
