<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        /* --- GENERAL & ANIMACIONES --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdf2e9; color: #333; overflow-x: hidden; }
        
        /* --- HEADER --- */
        .header { 
            background: #fff; padding: 15px 25px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 4px solid #000; position: sticky; top: 0; z-index: 1000; 
        }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-text { font-family: 'Archivo Black', sans-serif; font-size: 22px; color: #ff4500; text-shadow: 2px 2px 0px #000; }

        .header-right { display: flex; gap: 15px; align-items: center; }
        .cart-btn { 
            background: #fff; border: 3px solid #000; width: 48px; height: 48px; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            position: relative; text-decoration: none; font-size: 20px; box-shadow: 3px 3px 0px #000; 
        }

        /* --- SWIPER (FIXED) --- */
        .hero-swiper { width: 100%; height: 500px; border-bottom: 5px solid #000; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; background: #fff8f0; }
        .slide-container { 
            display: flex; align-items: center; justify-content: space-around; 
            width: 90%; max-width: 1100px; gap: 20px;
        }
        .slide-text { flex: 1; }
        .slide-text h1 { font-family: 'Archivo Black', sans-serif; font-size: 45px; text-transform: uppercase; line-height: 1; margin-bottom: 15px; }
        .slide-img { width: 400px; height: 300px; object-fit: cover; border-radius: 30px; border: 4px solid #000; box-shadow: 8px 8px 0px #ff6b00; }

        /* --- GRID --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 20px; border: 3px solid #000; overflow: hidden; box-shadow: 6px 6px 0px #000; display: flex; flex-direction: column; }
        .card-image { width: 100%; height: 200px; object-fit: cover; border-bottom: 3px solid #000; }

        /* --- CHATBOT STYLE --- */
        #chat-window { 
            display: none; position: fixed; bottom: 95px; right: 20px; width: 350px; height: 500px; 
            background: #fff; border: 4px solid #000; border-radius: 20px; flex-direction: column; 
            z-index: 10000; box-shadow: 12px 12px 0px rgba(0,0,0,0.2); overflow: hidden;
        }
        .bot-msg, .user-msg { padding: 10px; border-radius: 15px; border: 2px solid #000; max-width: 85%; font-size: 14px; margin-bottom: 8px; }
        .bot-msg { background: #fff; align-self: flex-start; }
        .user-msg { background: #ff6b00; color: #fff; align-self: flex-end; }
        
        /* DROPDOWN FIX */
        .user-dropdown { 
            display: none; position: absolute; top: 60px; right: 0; background: white; 
            border: 4px solid #000; width: 250px; padding: 15px; z-index: 2000; border-radius: 15px;
        }
        .user-dropdown.active { display: block; }
    </style>
</head>
<body>

    <audio id="chatMusic" loop>
        <source src="imagenes/cancion.mp3" type="audio/mpeg">
    </audio>

    <header class="header">
        <a href="index.html" class="logo-container">
            <span class="logo-text">FREDDY'S PIZZA</span>
        </a>
        <div class="header-right">
            <div id="userMenuContainer" style="position: relative;">
                <div class="cart-btn" id="userBtn">👤</div>
                <div class="user-dropdown" id="userDropdown">
                    <div id="userInfo" style="text-align:center; margin-bottom:10px;">
                        <h4 id="userName">Invitado</h4>
                        <p id="userRole" style="font-size:10px; color:orange; font-weight:bold;"></p>
                    </div>
                    <div id="adminLinkContainer"></div>
                    <button onclick="cerrarSesion()" style="width:100%; padding:5px; cursor:pointer;">Cerrar Sesión</button>
                </div>
            </div>
            <a href="carrito.html" class="cart-btn">🛒<span id="cartBadge" style="display:none; position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:20px; height:20px; font-size:12px; display:flex; align-items:center; justify-content:center; border:2px solid #000;">0</span></a>
        </div>
    </header>

    <div class="swiper hero-swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="slide-container">
                    <div class="slide-text">
                        <h1>Pepperoni <br> Legendario</h1>
                        <p>Nuestra pizza estrella con ingredientes frescos.</p>
                        <button class="add-btn" onclick="window.location.href='catalogo.html'" style="padding:15px 30px; background:#ff6b00; color:#fff; border:3px solid #000; font-weight:bold; cursor:pointer;">¡ORDENAR YA!</button>
                    </div>
                    <img src="imagenes/pizza_pepe.png" class="slide-img">
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 style="text-align:center; font-family:'Archivo Black'; margin-bottom:30px;">ESPECIALIDADES</h2>
        <div class="grid-container" id="productos-container"></div>
    </div>

    <div id="chat-bubble" onclick="toggleChat()" style="position: fixed; bottom: 20px; right: 20px; background: #ff6b00; border: 3px solid #000; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; z-index: 10000; box-shadow: 5px 5px 0px #000;">🍕</div>

    <div id="chat-window">
        <div style="background: #000; color: #fff; padding: 15px; font-family: 'Archivo Black'; display: flex; justify-content: space-between;">
            <span>FREDDY'S BOT 🤖</span>
            <span onclick="toggleChat()" style="cursor:pointer;">✕</span>
        </div>
        <div id="chat-messages" style="flex-grow: 1; padding: 15px; overflow-y: auto; background: #fdf2e9; display: flex; flex-direction: column;"></div>
        
        <div style="padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: #fff; border-top: 2px solid #000;">
            <button onclick="window.location.href='catalogo.html'" style="padding:5px; border:2px solid #000; cursor:pointer; background:#fff;">🍕 Menú</button>
            <button onclick="showSchedule()" style="padding:5px; border:2px solid #000; cursor:pointer; background:#fff;">⏰ Horario</button>
            <button onclick="window.location.href='Conta.html'" style="padding:5px; border:2px solid #000; cursor:pointer; background:#fff;">📞 Contacto</button>
            <button onclick="clearChat()" style="padding:5px; border:2px solid #000; cursor:pointer; background:#fff;">🗑️ Limpiar</button>
        </div>

        <div style="padding: 10px; border-top: 3px solid #000; display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="Pregunta algo..." style="flex:1; padding:10px; border:2px solid #000; border-radius:10px;">
            <button onclick="handleChat()" style="background:#ff6b00; border:2px solid #000; padding:10px; border-radius:10px; font-weight:bold;">></button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- INICIO ---
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            cargarPizzas();
            updateCartBadge();
            // Desbloquear audio al primer toque
            document.body.addEventListener('click', () => {
                const music = document.getElementById('chatMusic');
                if(music.paused) music.play().catch(()=>{});
            }, {once: true});
        });

        async function cargarPizzas() {
            const { data } = await supabaseClient.from('pizzas').select('*');
            if (data) {
                const container = document.getElementById('productos-container');
                container.innerHTML = data.map(p => `
                    <div class="card">
                        <img src="${p.imagen_url}" class="card-image">
                        <div style="padding:15px;">
                            <h3>${p.nombre}</h3>
                            <p style="color:#ff6b00; font-weight:bold; font-size:20px;">$${p.precio}</p>
                            <button onclick="addToCart('${p.nombre}', ${p.precio}, '${p.imagen_url}')" style="margin-top:10px; width:100%; padding:10px; background:#000; color:#fff; border:none; border-radius:10px; cursor:pointer;">Agregar</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // --- CHATBOT LOGIC ---
        let chatIniciado = false;
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
            if (win.style.display === 'flex' && !chatIniciado) {
                iniciarSaludo();
                chatIniciado = true;
            }
        }

        async function iniciarSaludo() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            let nombre = "Amigo";
            if (user) {
                const { data: p } = await supabaseClient.from('perfiles').select('nombre').eq('id', user.id).single();
                if (p) nombre = p.nombre;
            }
            addMessage("bot", `¡Hola **${nombre}**! 🍕 Soy Freddy Bot. ¿Quieres ver el menú o saber nuestros horarios?`);
        }

        async function handleChat() {
            const input = document.getElementById('chat-input');
            const txt = input.value.toLowerCase().trim();
            if (!txt) return;
            addMessage("user", input.value);
            input.value = '';

            // Inteligencia de respuesta
            if (txt.match(/(pizza|tienen|menu|catalogo|hambre|comer)/)) {
                const { data } = await supabaseClient.from('pizzas').select('nombre, precio');
                let lista = data.map(p => `• ${p.nombre} ($${p.precio})`).join('<br>');
                addMessage("bot", `¡Claro! Estas son nuestras pizzas:<br>${lista}`);
            } else if (txt.match(/(hola|buenos dias|que tal)/)) {
                addMessage("bot", "¡Hola! ¿Listo para pedir la mejor pizza?");
            } else if (txt.match(/(horario|abierto|cierran)/)) {
                showSchedule();
            } else {
                addMessage("bot", "Mmm, no entiendo eso. 😅 Prueba preguntando por nuestras 'pizzas' o usa los botones de abajo. Si necesitas ayuda humana, ve a **Contacto**.");
            }
        }

        function addMessage(sender, msg) {
            const div = document.createElement('div');
            div.className = sender === 'bot' ? 'bot-msg' : 'user-msg';
            div.innerHTML = msg;
            document.getElementById('chat-messages').appendChild(div);
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        }

        function showSchedule() { addMessage("bot", "⏰ **Horarios:**<br>Lun-Vie: 11am - 10pm<br>Sáb-Dom: 11am - 12pm"); }
        function clearChat() { document.getElementById('chat-messages').innerHTML = ''; chatIniciado = false; iniciarSaludo(); }

        // --- AUTH & CARRITO ---
        async function initAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                const { data: p } = await supabaseClient.from('perfiles').select('*').eq('id', user.id).single();
                document.getElementById('userName').textContent = p?.nombre || user.email;
                document.getElementById('userRole').textContent = p?.rol || 'Usuario';
                if (p?.rol === 'admin') document.getElementById('adminLinkContainer').innerHTML = '<a href="panelA.html" style="display:block; margin-bottom:10px;">⚙️ Panel Admin</a>';
                document.getElementById('userBtn').onclick = () => document.getElementById('userDropdown').classList.toggle('active');
            } else {
                document.getElementById('userBtn').onclick = () => window.location.href = 'login.html';
            }
        }

        function addToCart(n, p, i) {
            let c = JSON.parse(localStorage.getItem('pizzaCart')) || {};
            c[n] = c[n] ? {...c[n], quantity: c[n].quantity + 1} : {name:n, price:p, image:i, quantity:1};
            localStorage.setItem('pizzaCart', JSON.stringify(c));
            updateCartBadge();
        }

        function updateCartBadge() {
            let c = JSON.parse(localStorage.getItem('pizzaCart')) || {};
            let total = Object.values(c).reduce((a, b) => a + b.quantity, 0);
            document.getElementById('cartBadge').style.display = total > 0 ? 'flex' : 'none';
            document.getElementById('cartBadge').textContent = total;
        }

        async function cerrarSesion() { await supabaseClient.auth.signOut(); window.location.reload(); }
    </script>
</body>
</html>
