<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- ESTILOS ORIGINALES RECUPERADOS --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdf2e9; overflow-x: hidden; }
        
        .header { background: #fff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid #000; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-family: 'Archivo Black'; font-size: 24px; color: #ff4500; text-shadow: 2px 2px 0px #000; text-decoration: none; }
        .auth-buttons { display: flex; gap: 10px; }
        .btn-header { padding: 8px 15px; border: 3px solid #000; background: #fff; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0px #000; text-decoration: none; color: #000; }

        /* HERO SLIDER ORIGINAL */
        .hero { background: #fff; padding: 60px 20px; border-bottom: 5px solid #000; display: flex; align-items: center; justify-content: center; gap: 40px; min-height: 450px; }
        .hero-content h1 { font-family: 'Archivo Black'; font-size: 50px; line-height: 1; margin-bottom: 20px; }
        .hero-img { width: 400px; border-radius: 20px; border: 5px solid #000; box-shadow: 10px 10px 0px #ff6b00; }
        .btn-order { display: inline-block; padding: 15px 30px; background: #ff6b00; color: #fff; border: 4px solid #000; font-family: 'Archivo Black'; text-decoration: none; box-shadow: 5px 5px 0px #000; }

        /* CHATBOT FNAF STYLE */
        #chat-trigger { position: fixed; bottom: 20px; right: 20px; background: #ff6b00; border: 4px solid #000; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; cursor: pointer; z-index: 10001; box-shadow: 6px 6px 0px #000; }
        #chat-window { display: none; position: fixed; bottom: 100px; right: 20px; width: 350px; height: 500px; background: #fff; border: 5px solid #000; border-radius: 20px; flex-direction: column; z-index: 10000; box-shadow: 15px 15px 0px rgba(0,0,0,0.2); overflow: hidden; }
        .chat-header { background: #000; color: #fff; padding: 12px; font-family: 'Archivo Black'; display: flex; justify-content: space-between; }
        #chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; background: #fdf2e9; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; border: 3px solid #000; max-width: 85%; font-size: 14px; font-weight: bold; }
        .bot { background: #fff; align-self: flex-start; }
        .user { background: #ff6b00; color: #fff; align-self: flex-end; }
        
        .chat-footer { padding: 10px; border-top: 4px solid #000; display: flex; gap: 5px; background: #fff; }
        .chat-input { flex: 1; padding: 10px; border: 3px solid #000; border-radius: 10px; }
        .send-btn { background: #ff6b00; border: 3px solid #000; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        /* BOTONES DE CONTROL DENTRO DEL CHAT */
        .chat-control-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 10px; background: #eee; border-top: 3px solid #000; }
        .c-btn { background: #fff; border: 2px solid #000; padding: 5px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .music-bar { background: #ffeb3b; padding: 5px; text-align: center; font-weight: bold; font-size: 11px; border-bottom: 2px solid #000; cursor: pointer; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.myinstants.com/media/sounds/fnaf-sister-location-night-start-50502.mp3" type="audio/mpeg">
    </audio>

    <header class="header">
        <a href="index.html" class="logo-text">FREDDY'S PIZZA</a>
        <div class="auth-buttons">
            <a href="perfil.html" class="btn-header">👤 Mi Perfil</a>
            <button class="btn-header" onclick="location.reload()">Cerrar Sesión</button>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>PEPPERONI<br>LEGENDARIO</h1>
            <p>Nuestra pizza estrella con ingredientes frescos y el toque secreto de Freddy.</p>
            <a href="catalogo.html" class="btn-order">¡ORDENAR YA!</a>
        </div>
        <img src="imagenes/pizza_pepe.png" class="hero-img">
    </section>

    <div id="chat-trigger">🍕</div>

    <div id="chat-window">
        <div class="chat-header"><span>FREDDY'S BOT 🤖</span><span onclick="toggleChat()" style="cursor:pointer">✕</span></div>
        <div id="music-btn" class="music-bar" onclick="playMusic()">🎵 CLIC AQUÍ PARA ACTIVAR SONIDO 🎵</div>
        <div id="chat-messages"></div>
        
        <div class="chat-control-btns">
            <button class="c-btn" onclick="fetchMenu('pizzas')">🍕 Ver Pizzas</button>
            <button class="c-btn" onclick="fetchMenu('bebidas')">🥤 Bebidas</button>
            <button class="c-btn" onclick="addBotMsg('⏰ Horario: 11:00 AM - 10:00 PM')">⏰ Horarios</button>
            <button class="c-btn" onclick="document.getElementById('chat-messages').innerHTML=''">🗑️ Limpiar</button>
        </div>

        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Dime algo...">
            <button onclick="handleChat()" class="send-btn">></button>
        </div>
    </div>

    <script>
        // Configuración Supabase (Asegúrate de darle a "RESUME" en el panel)
        const supabaseClient = supabase.createClient('https://vndfmcxlifcwzpjbphoy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY');

        const chistes = [
            "¿Por qué la pizza fue al médico? Porque le faltaba masa emocional. 😂",
            "¿Qué le dice una pizza a otra? ¡Qué buena masa tienes!",
            "No entendí eso... pero si tienes hambre, ¡pide una pizza!"
        ];

        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
            if(document.getElementById('chat-messages').innerHTML === "") addBotMsg("¡Hola! Soy Freddy. ¿Qué te apetece hoy?");
        }

        document.getElementById('chat-trigger').onclick = toggleChat;

        function playMusic() {
            const m = document.getElementById('bgMusic');
            m.play();
            document.getElementById('music-btn').innerHTML = "🔊 MÚSICA ACTIVA";
            document.getElementById('music-btn').style.background = "#8bc34a";
        }

        async function fetchMenu(cat) {
            const { data, error } = await supabaseClient.from('productos').select('nombre, precio').eq('categoria', cat);
            if(error || !data || data.length === 0) {
                addBotMsg("⚠️ ¡Error de conexión! Por favor, verifica que tu proyecto de Supabase esté ACTIVO (no en pausa).");
            } else {
                let lista = data.map(p => `• ${p.nombre} ($${p.precio})`).join('<br>');
                addBotMsg(`**${cat.toUpperCase()}:**<br>${lista}`);
            }
        }

        function handleChat() {
            const input = document.getElementById('chat-input');
            const txt = input.value.toLowerCase().trim();
            if(!txt) return;

            addUserMsg(input.value);
            input.value = '';

            setTimeout(() => {
                if(txt.includes("pizza")) fetchMenu('pizzas');
                else if(txt.includes("bebida")) fetchMenu('bebidas');
                else if(txt.includes("hola")) addBotMsg("¡Hola! ¿Buscas comida o solo vienes a saludar?");
                else addBotMsg(chistes[Math.floor(Math.random()*chistes.length)]);
            }, 600);
        }

        function addBotMsg(t) {
            const d = document.createElement('div'); d.className = 'msg bot'; d.innerHTML = t;
            document.getElementById('chat-messages').appendChild(d);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        function addUserMsg(t) {
            const d = document.createElement('div'); d.className = 'msg user'; d.textContent = t;
            document.getElementById('chat-messages').appendChild(d);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        document.getElementById('chat-input').onkeypress = (e) => { if(e.key==='Enter') handleChat(); };
    </script>
</body>
</html>
