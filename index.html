<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        /* --- ESTILOS BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdf2e9; color: #333; overflow-x: hidden; }
        
        /* --- HEADER --- */
        .header { 
            background: #fff; padding: 15px 25px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 4px solid #000; position: sticky; top: 0; z-index: 1000; 
        }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; }
        .logo-text { font-family: 'Archivo Black', sans-serif; font-size: 22px; color: #ff4500; text-shadow: 2px 2px 0px #000; }

        .header-right { display: flex; gap: 15px; align-items: center; }

        .cart-btn { 
            background: #fff; border: 3px solid #000; color: #000; 
            width: 48px; height: 48px; border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; text-decoration: none; font-size: 20px;
            box-shadow: 3px 3px 0px #000; transition: 0.3s; overflow: hidden;
        }

        .cart-badge { 
            position: absolute; top: -8px; right: -8px; background: #ff3d00; 
            color: #fff; border: 2px solid #000; border-radius: 50%; 
            min-width: 22px; height: 22px; font-size: 11px; font-weight: 900; 
            display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0px #000;
        }

        /* --- DROPDOWN (ESTILO SEGUNDA IMAGEN) --- */
        .user-dropdown { 
            display: none; position: absolute; top: 65px; right: 0; 
            background: white; border: 4px solid #000; box-shadow: 8px 8px 0px #000; 
            width: 280px; padding: 20px; z-index: 2000; border-radius: 15px;
        }
        .user-dropdown.active { display: block; animation: slideDown 0.3s ease; }

        @keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

        .user-info-box { text-align: center; margin-bottom: 15px; }
        .dropdown-avatar { width: 65px; height: 65px; border-radius: 50%; border: 3px solid #000; margin-bottom: 10px; object-fit: cover; }
        .user-name { font-family: 'Archivo Black', sans-serif; font-size: 17px; color: #000; margin-bottom: 2px; }
        .user-email { font-size: 10px; color: #888; margin-bottom: 5px; word-break: break-all; }
        .user-role-badge { font-size: 11px; font-weight: 900; color: #ff4500; text-transform: uppercase; margin-bottom: 10px; }

        .profile-menu-link {
            display: flex; align-items: center; gap: 12px;
            padding: 14px; border-radius: 12px; text-decoration: none;
            color: #000; font-weight: 800; font-size: 14px;
            background: #f8f9fa; margin-bottom: 8px; transition: 0.2s;
        }
        .profile-menu-link:hover { background: #eee; transform: scale(1.02); }
        .profile-menu-link i { color: #6f42c1; font-size: 16px; }

        /* Botón Panel Admin Negro */
        .admin-link { background: #000 !important; color: #fff !important; text-transform: uppercase; }
        .admin-link:hover { opacity: 0.8; }

        .logout-btn { 
            width: 100%; padding: 12px; margin-top: 10px; background: none; 
            border: none; color: #ff4500; font-family: 'Archivo Black', sans-serif;
            font-size: 14px; cursor: pointer; text-transform: uppercase;
        }

        /* --- HERO & GRID --- */
        .hero-swiper { width: 100%; min-height: 500px; border-bottom: 5px solid #000; background: #fdf2e9; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .slide-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; width: 100%; max-width: 1100px; background: #f7d794; padding: 40px; border-radius: 40px; border: 4px solid #000; box-shadow: 12px 12px 0px #000; }
        .slide-text h1 { font-family: 'Archivo Black', sans-serif; font-size: 50px; color: #fff; text-shadow: 4px 4px 0px #000; text-transform: uppercase; line-height: 1; margin-bottom: 15px; }
        .slide-img { max-height: 380px; width: auto; border-radius: 30px; border: 4px solid #000; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 25px; border: 4px solid #000; overflow: hidden; box-shadow: 8px 8px 0px #000; transition: 0.3s; }
        .card-image { width: 100%; height: 250px; object-fit: cover; border-bottom: 4px solid #000; }
        .card-info { padding: 20px; }
        .card-price { color: #ff4500; font-size: 28px; font-weight: 900; font-family: 'Archivo Black', sans-serif; }
        
        .add-btn { background: #fff; color: #000; border: 3px solid #000; padding: 12px 20px; border-radius: 15px; cursor: pointer; font-weight: 900; box-shadow: 4px 4px 0px #000; }
        .add-btn:hover { background: #000; color: #fff; }

        @media (max-width: 850px) { .slide-container { grid-template-columns: 1fr; text-align: center; } }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo-container">
            <img src="imagenes/logo.png" alt="Logo" class="logo-img">
            <span class="logo-text">FREDDY'S PIZZA</span>
        </a>
        <div class="header-right">
            <div style="position: relative;" id="userMenuContainer">
                <div class="cart-btn" id="userBtn">👤</div>
                
                <div class="user-dropdown" id="userDropdown">
                    <div id="dropdownContent">
                        </div>
                </div>
            </div>

            <a href="carrito.html" class="cart-btn">
                🛒<span id="cartBadge" class="cart-badge" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <section class="swiper hero-swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="slide-container">
                    <div class="slide-text">
                        <h1>Pepperoni <br> Legendario</h1>
                        <p>Nuestra pizza estrella con pepperoni de corte grueso y mezcla secreta de quesos.</p>
                        <br>
                        <button class="add-btn" style="background:#000; color:#fff;">¡ORDENAR YA!</button>
                    </div>
                    <img src="imagenes/pizza_pepe.png" class="slide-img">
                </div>
            </div>
        </div>
    </section>

    <div class="container">
        <div class="grid-container">
            <div class="card">
                <img src="imagenes/pizza_pepe.png" class="card-image">
                <div class="card-info">
                    <h3 style="font-family:'Archivo Black'">Pepperoni Premium</h3>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                        <span class="card-price">$121.99</span>
                        <button class="add-btn" onclick="addToCart('Pepperoni Premium', 121.99, 'imagenes/pizza_pepe.png')">AGREGAR</button>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            updateCartBadge();
            new Swiper('.hero-swiper', { loop: true, autoplay: { delay: 5000 } });
        });

        async function initAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const userBtn = document.getElementById('userBtn');
            const userDropdown = document.getElementById('userDropdown');
            const dropdownContent = document.getElementById('dropdownContent');

            if (user) {
                // Obtenemos los datos de tu tabla perfiles
                const { data: perfil } = await supabaseClient
                    .from('perfiles')
                    .select('rol, nombre, avatar_url')
                    .eq('id', user.id)
                    .maybeSingle();

                const rol = perfil ? perfil.rol : 'usuario';
                const nombre = (perfil && perfil.nombre) ? perfil.nombre : 'Usuario';
                const fotoUrl = (perfil && perfil.avatar_url) ? perfil.avatar_url : 'imagenes/freddy.png';
                
                // 1. Ponemos la foto en el botón del header (como en tu foto 2)
                userBtn.innerHTML = `<img src="${fotoUrl}" style="width:100%; height:100%; object-fit:cover;">`;
                
                userBtn.onclick = (e) => { 
                    e.stopPropagation();
                    userDropdown.classList.toggle('active'); 
                };

                // 2. Construimos el menú exactamente como la Imagen 2
                let menuHtml = `
                    <div class="user-info-box">
                        <img src="${fotoUrl}" class="dropdown-avatar">
                        <div class="user-name">${nombre}</div>
                        <div class="user-email">${user.email}</div>
                        <div class="user-role-badge">${rol}</div>
                    </div>
                `;

                // Si es admin, mostramos el botón negro arriba
                if (rol === 'admin') {
                    menuHtml += `<a href="panelA.html" class="profile-menu-link admin-link">⚙️ PANEL ADMIN</a>`;
                }

                // Botón Mi Perfil (Morado/Gris)
                menuHtml += `
                    <a href="perfil.html" class="profile-menu-link">
                        <span style="color:#6f42c1;">👤</span> Mi Perfil
                    </a>
                    <button onclick="cerrarSesion()" class="logout-btn">CERRAR SESIÓN</button>
                `;

                dropdownContent.innerHTML = menuHtml;

            } else {
                // Si no hay sesión, mandamos al login
                userBtn.onclick = () => window.location.href = 'login.html';
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // Carrito
        function addToCart(name, price, img) {
            let cart = JSON.parse(localStorage.getItem('pizzaCart')) || {};
            cart[name] = cart[name] ? {...cart[name], quantity: cart[name].quantity + 1} : {name, price, image: img, quantity: 1};
            localStorage.setItem('pizzaCart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('pizzaCart')) || {};
            let total = Object.values(cart).reduce((s, i) => s + i.quantity, 0);
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.style.display = total > 0 ? 'flex' : 'none';
                badge.textContent = total;
            }
        }

        // Cerrar al hacer click fuera
        window.onclick = (e) => {
            const container = document.getElementById('userMenuContainer');
            if (container && !container.contains(e.target)) {
                document.getElementById('userDropdown').classList.remove('active');
            }
        };
    </script>
</body>
</html>
