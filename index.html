<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- RESTAURANDO LA ESTÉTICA ORIGINAL (BORDES GRUESOS) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdf2e9; overflow-x: hidden; }

        .header { 
            background: #fff; padding: 15px 25px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 5px solid #000; position: sticky; top: 0; z-index: 1000; 
        }
        .logo-text { font-family: 'Archivo Black'; font-size: 24px; color: #ff4500; text-shadow: 2px 2px 0px #000; text-decoration: none; }

        /* --- BOTÓN FLOTANTE ORIGINAL --- */
        #chat-trigger { 
            position: fixed; bottom: 20px; right: 20px; background: #ff6b00; 
            border: 4px solid #000; width: 70px; height: 70px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 35px; cursor: pointer; z-index: 10001; box-shadow: 6px 6px 0px #000;
        }

        /* --- VENTANA DE CHAT ESTILO COMIC --- */
        #chat-window { 
            display: none; position: fixed; bottom: 100px; right: 20px; width: 350px; height: 500px; 
            background: #fff; border: 5px solid #000; border-radius: 20px; flex-direction: column; 
            z-index: 10000; box-shadow: 15px 15px 0px rgba(0,0,0,0.2); overflow: hidden;
        }
        .chat-header { background: #000; color: #fff; padding: 12px; font-family: 'Archivo Black'; display: flex; justify-content: space-between; align-items: center; }
        #chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; background: #fdf2e9; display: flex; flex-direction: column; gap: 10px; }
        
        /* BURBUJAS DE MENSAJE */
        .msg { padding: 10px 15px; border-radius: 15px; border: 3px solid #000; max-width: 85%; font-size: 14px; font-weight: bold; position: relative; }
        .bot { background: #fff; align-self: flex-start; }
        .user { background: #ff6b00; color: #fff; align-self: flex-end; }

        .chat-footer { padding: 10px; border-top: 4px solid #000; display: flex; gap: 5px; background: #fff; }
        .chat-input { flex: 1; padding: 10px; border: 3px solid #000; border-radius: 10px; font-weight: bold; }
        .send-btn { background: #ff6b00; border: 3px solid #000; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .music-bar { background: #8bc34a; color: #000; padding: 5px; text-align: center; font-size: 12px; font-weight: bold; border-bottom: 3px solid #000; cursor: pointer; }
    </style>
</head>
<body>

    <audio id="freddyMusic" loop>
        <source src="https://www.myinstants.com/media/sounds/fnaf-sister-location-night-start-50502.mp3" type="audio/mpeg">
    </audio>

    <header class="header">
        <a href="#" class="logo-text">FREDDY'S PIZZA</a>
    </header>

    <main style="padding: 50px 20px; text-align: center;">
        <h1 style="font-family: 'Archivo Black'; font-size: 45px;">¡BIENVENIDO! 🍕</h1>
        <p style="font-weight: bold; margin-top: 10px;">Haz clic en la pizza para hablar con el bot.</p>
    </main>

    <div id="chat-trigger">🍕</div>

    <div id="chat-window">
        <div class="chat-header">
            <span>FREDDY'S BOT 🤖</span>
            <span id="close-chat" style="cursor:pointer">✕</span>
        </div>
        <div id="music-btn" class="music-bar">🎵 CLIC PARA ACTIVAR SONIDO FNAF 🎵</div>
        <div id="chat-messages"></div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Escribe tu duda...">
            <button id="send-btn" class="send-btn">></button>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://vndfmcxlifcwzpjbphoy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY');

        const chistes = [
            "¿Por qué la pizza fue al médico? Porque le faltaba un poco de 'masa' emocional. 😂",
            "¿Qué hace una pizza en un gimnasio? ¡Estirar la masa! 🍕",
            "Freddy dice: Si no hay pizza, no hay felicidad. ¡Pide ya!",
            "¡Uh oh! Parece que mis cables se cruzaron. No entendí, pero te cuento que la pizza de pepperoni es mi favorita.",
            "No estoy seguro de eso, pero... ¿sabías que puedo comer 20 pizzas en un minuto? (Es broma, soy un bot)."
        ];

        // Abrir/Cerrar
        document.getElementById('chat-trigger').onclick = () => {
            document.getElementById('chat-window').style.display = 'flex';
            if(document.getElementById('chat-messages').innerHTML === "") {
                addBotMsg("¡Hola! Bienvenido a Freddy's. ¿Qué te gustaría ordenar o en qué te ayudo?");
            }
        };

        document.getElementById('close-chat').onclick = () => document.getElementById('chat-window').style.display = 'none';

        // Música
        document.getElementById('music-btn').onclick = function() {
            const audio = document.getElementById('freddyMusic');
            audio.play();
            this.innerHTML = "🔊 MÚSICA DE FNAF ACTIVA";
            this.style.background = "#ffeb3b";
        };

        async function handleChat() {
            const input = document.getElementById('chat-input');
            const rawText = input.value.trim();
            if(!rawText) return;

            addUserMsg(rawText);
            const text = rawText.toLowerCase();
            input.value = '';

            setTimeout(async () => {
                // Lógica de productos
                if(text.includes("menu") || text.includes("pizza") || text.includes("bebida") || text.includes("tienen") || text.includes("precios")) {
                    const { data, error } = await supabaseClient.from('productos').select('nombre, precio, categoria');
                    if(error || !data) {
                        addBotMsg("¡Vaya! No puedo leer el menú. **Recuerda darle a 'Resume' en tu Supabase**.");
                    } else {
                        let lista = data.map(p => `• ${p.nombre} ($${p.precio})`).join('<br>');
                        addBotMsg(`**Esto tenemos para ti:**<br>${lista}`);
                    }
                } 
                // Respuesta si dicen que no se oye
                else if(text.includes("oye") || text.includes("audio") || text.includes("musica")) {
                    addBotMsg("¿No se oye? ¡Asegúrate de darle al botón verde arriba en el chat para activar el sonido de Sister Location!");
                }
                // Chistes/Inesperados
                else {
                    const azar = chistes[Math.floor(Math.random() * chistes.length)];
                    addBotMsg(azar);
                }
            }, 600);
        }

        function addBotMsg(t) {
            const d = document.createElement('div'); d.className = 'msg bot'; d.innerHTML = t;
            document.getElementById('chat-messages').appendChild(d);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        function addUserMsg(t) {
            const d = document.createElement('div'); d.className = 'msg user'; d.textContent = t;
            document.getElementById('chat-messages').appendChild(d);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        document.getElementById('send-btn').onclick = handleChat;
        document.getElementById('chat-input').onkeypress = (e) => { if(e.key==='Enter') handleChat(); };
    </script>
</body>
</html>
