<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EVDX4YSVLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EVDX4YSVLB');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="freddy.png">
    <title>FREDDY'S PIZZA - Inicio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        /* --- TUS ESTILOS ORIGINALES --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdf2e9; color: #333; overflow-x: hidden; }
        
        .header { background: #fff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #000; position: sticky; top: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; width: auto; transition: 0.3s; }
        .logo-text { font-family: 'Archivo Black', sans-serif; font-size: 22px; color: #ff4500; text-shadow: 2px 2px 0px #000; }
        .header-right { display: flex; gap: 15px; align-items: center; }

        .cart-btn { background: #fff; border: 3px solid #000; color: #000; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; text-decoration: none; font-size: 20px; box-shadow: 3px 3px 0px #000; transition: 0.3s; }
        .cart-btn:hover { background: #ff6b00; transform: scale(1.1); color: #fff; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background-color: #ff3d00; color: #fff; border: 2px solid #000; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; font-family: 'Archivo Black', sans-serif; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0px #000; z-index: 10; }

        /* --- ESTILOS DEL CHATBOT MEJORADOS (INTEGRADOS) --- */
        #chat-window {
            display: none; position: fixed; bottom: 100px; right: 25px; 
            width: 350px; height: 500px; background: #fff; 
            border: 4px solid #000; border-radius: 20px; 
            flex-direction: column; overflow: hidden; z-index: 5000; 
            box-shadow: 12px 12px 0px rgba(0,0,0,0.2);
            animation: slideDown 0.3s ease-out;
        }

        .chat-header { background: #000; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-family: 'Archivo Black', sans-serif; font-size: 14px; }
        
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #fdf2e9; display: flex; flex-direction: column; gap: 12px; }
        
        .msg-bot { background: #fff; border: 3px solid #000; padding: 10px; border-radius: 15px 15px 15px 2px; box-shadow: 3px 3px 0px #000; align-self: flex-start; max-width: 85%; font-size: 13px; font-weight: 600; }
        .msg-user { background: #ff6b00; border: 3px solid #000; padding: 10px; border-radius: 15px 15px 2px 15px; box-shadow: 3px 3px 0px #000; align-self: flex-end; max-width: 80%; font-size: 13px; color: #fff; font-weight: bold; }

        .chat-footer { padding: 10px; border-top: 3px solid #000; display: flex; gap: 5px; background: #fff; }
        .chat-input { flex: 1; border: 2px solid #000; padding: 8px; border-radius: 8px; outline: none; font-weight: bold; }
        .chat-send { background: #ff6b00; border: 2px solid #000; color: white; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .chat-btn-group { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .chat-opt { background: #fff; border: 2px solid #000; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; box-shadow: 2px 2px 0px #000; }
        .chat-opt:hover { background: #ff6b00; color: #fff; }

        /* --- RESTO DE TUS ESTILOS --- */
        .hero-swiper { width: 100%; min-height: 500px; border-bottom: 5px solid #000; background-image: url('imagenes/carrusel.png'); background-size: cover; background-position: center; }
        .slide-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; width: 100%; max-width: 1100px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 30px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.3); }
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 20px; border: 3px solid #000; overflow: hidden; box-shadow: 6px 6px 0px #000; transition: 0.3s; display: flex; flex-direction: column; }
        .add-btn { background: #fff; color: #000; border: 3px solid #000; padding: 12px 20px; border-radius: 15px; cursor: pointer; font-weight: 900; transition: 0.2s; box-shadow: 4px 4px 0px #000; text-transform: uppercase; font-size: 13px; }
    </style>
</head>
<body>

<audio id="bg-music-freddy" src="https://www.myinstants.com/media/sounds/fnaf-sister-location-night-start.mp3" preload="auto" loop></audio>
<audio id="sound-bong" src="https://www.myinstants.com/media/sounds/freddys-honk-nose.mp3" preload="auto"></audio>

<div id="chat-trigger" onclick="toggleChat()" style="position: fixed; bottom: 25px; right: 25px; background: #ff6b00; color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; box-shadow: 4px 4px 0px #000; z-index: 5001; border: 3px solid #000;">
    🐻
</div>

<div id="chat-window">
    <div class="chat-header">
        <span>FREDDY'S HELPER</span>
        <button onclick="toggleChat()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <div id="chat-messages">
        <div class="msg-bot">¡Hola! Soy Freddy Fazbear. ¿En qué puedo ayudarte hoy en la pizzería? 🍕</div>
        <div class="chat-btn-group">
            <button class="chat-opt" onclick="botLogic('menu')">🍕 Ver Menú</button>
            <button class="chat-opt" onclick="botLogic('promo')">🎁 Promos</button>
            <button class="chat-opt" onclick="botLogic('donde')">📍 Ubicación</button>
        </div>
    </div>
    <div class="chat-footer">
        <input type="text" id="chat-input" class="chat-input" placeholder="Escribe aquí...">
        <button onclick="userSend()" class="chat-send">></button>
    </div>
</div>

<header class="header">
    <a href="index.html" class="logo-container">
        <img src="imagenes/logo.png" alt="Freddy's Logo" class="logo-img">
        <span class="logo-text">FREDDY'S PIZZA</span>
    </a>
    <div class="header-right">
        <div style="position: relative;" id="userMenuContainer">
            <div class="cart-btn" id="userBtn">👤</div>
            <div class="user-dropdown" id="userDropdown">
                <div class="user-info-box">
                    <img id="userAvatarDropdown" src="" class="dropdown-avatar" style="display: none;">
                    <div id="userInitial" style="width:60px; height:60px; background:#ff6b00; color:#fff; display:none; align-items:center; justify-content:center; font-weight:900; border-radius:50%; border: 3px solid #000; margin: 0 auto 10px; font-size: 24px;"></div>
                    <h4 id="userName"></h4>
                    <p id="userEmail"></p>
                    <p id="userRole" class="user-role-badge"></p>
                </div>
                <div id="adminLinkContainer"></div>
                <a href="perfil.html" class="profile-menu-link">👤 Mi Perfil</a>
                <button onclick="cerrarSesion()" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
        <a href="carrito.html" class="cart-btn">
            🛒<span id="cartBadge" class="cart-badge" style="display: none;">0</span>
        </a>
    </div>
</header>

<section class="swiper hero-swiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide">
            <div class="slide-container">
                <div class="slide-text">
                    <h1>Pepperoni <br> Legendario</h1>
                    <p>Nuestra pizza estrella con pepperoni de corte grueso.</p>
                    <a href="catalogo.html" class="add-btn" style="text-decoration: none;">¡ORDENAR YA!</a>
                </div>
                <img src="imagenes/pizza_pepe.png" class="slide-img" alt="Pizza">
            </div>
        </div>
    </div>
</section>

<script>
    // --- LÓGICA DEL CHATBOT ---
    const chatWin = document.getElementById('chat-window');
    const chatMsgs = document.getElementById('chat-messages');
    const music = document.getElementById('bg-music-freddy');
    const bong = document.getElementById('sound-bong');

    function toggleChat() {
        const isHidden = chatWin.style.display === 'none' || chatWin.style.display === '';
        chatWin.style.display = isHidden ? 'flex' : 'none';
        if(isHidden) {
            music.volume = 0.2;
            music.play().catch(() => {});
        } else {
            music.pause();
        }
    }

    function userSend() {
        const input = document.getElementById('chat-input');
        if(!input.value.trim()) return;
        const text = input.value;
        addMsg(text, 'msg-user');
        input.value = "";
        botLogic(text);
    }

    function botLogic(input) {
        const val = input.toLowerCase();
        let res = "No estoy seguro de eso, pero puedes ver nuestro menú para elegir algo rico.";
        let btns = ["🍕 Ver Menú", "📍 Ubicación", "🏠 Inicio"];

        if(val.includes("menu") || val.includes("pizza") || val.includes("hambre")) {
            res = "¡Tenemos las mejores pizzas! 🍕<br>• Pepperoni: $121.99<br>• Suprema: $166.99<br>• Margherita: $158.99";
            btns = ["🛒 Ir al Catálogo", "🏠 Inicio"];
        } else if(val.includes("donde") || val.includes("ubicacion") || val.includes("lugar")) {
            res = "📍 Estamos en el corazón del centro educativo. ¡Ven antes de medianoche!";
        } else if(val.includes("promo") || val.includes("oferta")) {
            res = "🎁 ¡Hoy tenemos 2x1 en Pepperoni si ordenas desde la web!";
        } else if(val.includes("catalogo") || val.includes("comprar")) {
            res = "¡Claro! Haz clic aquí abajo para ir al catálogo:";
            res += `<br><a href="catalogo.html" style="color:#ff6b00; font-weight:bold;">Ver Catálogo Completo</a>`;
        } else if(val.includes("hola")) {
            res = "¡Hola! ¿Listo para una aventura pizzera?";
        }

        setTimeout(() => {
            bong.currentTime = 0;
            bong.play();
            addMsg(res, 'msg-bot');
            renderBtns(btns);
        }, 500);
    }

    function addMsg(text, type) {
        const div = document.createElement('div');
        div.className = type;
        div.innerHTML = `<b>${type === 'msg-user' ? 'Tú' : 'Freddy'}:</b> ${text}`;
        chatMsgs.appendChild(div);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }

    function renderBtns(opts) {
        const div = document.createElement('div');
        div.className = "chat-btn-group";
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "chat-opt";
            b.innerText = o;
            b.onclick = () => botLogic(o);
            div.appendChild(b);
        });
        chatMsgs.appendChild(div);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }

    // --- LÓGICA DE TU WEB ORIGINAL (SUPABASE Y CARRITO) ---
    const SUPABASE_URL = 'https://vndfmcxlifcwzpjbphoy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', () => {
        initAuth();
        updateCartBadge();
        new Swiper('.hero-swiper', { loop: true, autoplay: { delay: 5000 }, navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' } });
    });

    async function initAuth() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
            const { data: perfil } = await supabaseClient.from('perfiles').select('*').eq('id', user.id).maybeSingle();
            const nombre = perfil?.nombre || user.email.split('@')[0];
            document.getElementById('userName').textContent = nombre;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userBtn').onclick = (e) => { 
                e.stopPropagation();
                document.getElementById('userDropdown').classList.toggle('active'); 
            };
        } else {
            document.getElementById('userBtn').onclick = () => window.location.href = 'login.html';
        }
    }

    function updateCartBadge() {
        let cart = JSON.parse(localStorage.getItem('pizzaCart')) || {};
        let total = Object.values(cart).reduce((s, i) => s + i.quantity, 0);
        const badge = document.getElementById('cartBadge');
        badge.style.display = total > 0 ? 'flex' : 'none';
        badge.textContent = total;
    }

    document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') userSend(); });
</script>

</body>
</html>
