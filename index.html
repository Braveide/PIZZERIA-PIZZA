<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Iniciar Sesión</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* MANTENEMOS TUS ESTILOS ORIGINALES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#ff6b00; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); max-width: 450px; width: 100%; padding: 40px 30px; text-align: center; }
        .logo { width: 100px; height: 100px; margin: 0 auto 20px; background: linear-gradient(135deg, #ff6b00 0%, #ff3d00 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(255, 61, 0, 0.3); font-size: 40px; }
        h1 { font-size: 28px; color: #333; margin-bottom: 10px; font-weight: 600; }
        .subtitle { color: #666; font-size: 16px; margin-bottom: 30px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab { flex: 1; padding: 12px; background: #f5f5f5; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; color: #666; }
        .tab.active { background: #e8e8e8; color: #333; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
        .input-wrapper { position: relative; display: flex; align-items: center; background: #f5f5f5; border-radius: 10px; padding: 0 15px; }
        .input-icon { color: #999; margin-right: 10px; font-size: 18px; }
        .form-group input { width: 100%; padding: 15px 0; border: none; background: transparent; font-size: 15px; color: #333; outline: none; }
        .toggle-password { background: none; border: none; cursor: pointer; color: #999; font-size: 18px; }
        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(90deg, #ff6b00 0%, #ff3d00 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .back-link { display: inline-block; margin-top: 20px; color: #ff6b00; text-decoration: none; font-size: 14px; }
        #errorMessage { color: #e3342f; background-color: #fcebeb; padding: 10px; border-radius: 8px; margin-bottom: 20px; display: none; border: 1px solid #e3342f; font-size: 14px; }
        .separator { display: flex; align-items: center; text-align: center; margin: 25px 0 15px; }
        .separator::before, .separator::after { content: ''; flex: 1; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍕</div>
        <h1>Freddy´s Pizza</h1>
        <p class="subtitle">¡Bienvenido al Sistema!</p>
    
        <div id="errorMessage"></div>

        <div class="tabs">
            <button class="tab active">Iniciar Sesión</button>
            <a href="registro.html" style="flex: 1; text-decoration: none;">
                <button type="button" class="tab" style="width: 100%;">Registrarse</button>
            </a>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usernameInput">Correo Electrónico</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="email" id="usernameInput" placeholder="ejemplo@demo.com" required>
                </div>
            </div>
            <div class="form-group">
                <label for="passwordInput">Contraseña</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="passwordInput" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('passwordInput')">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <div class="separator">o</div>
        
        <div id="g_id_onload"
             data-client_id="304677210854-6t97pu7evthct109hqvs80b4ejmuavtq.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left" style="width: 100%; display: flex; justify-content: center;"></div>

        <a href="index.html" class="back-link">← Volver al Catálogo</a>
    </div>

    <script>
        // --- 1. PROTECCIÓN: SI YA ESTÁ LOGUEADO, REDIRIGIR FUERA DEL LOGIN ---
        window.onload = function() {
            const activeSession = JSON.parse(localStorage.getItem('userPizzaApp'));
            if (activeSession) {
                redirigirPorRol(activeSession.role);
            }
        };

        // --- 2. MANEJO DEL FORMULARIO ---
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('usernameInput').value.trim().toLowerCase();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';

            let role = null;
            let name = '';

            // Lógica de roles demo
            if (email === 'admin@demo.com') {
                role = 'admin';
                name = 'Administrador Freddy';
            } else if (email === 'vendor@demo.com') {
                role = 'vendor';
                name = 'Vendedor de Turno';
            } else if (email === 'cliente@demo.com') {
                role = 'client';
                name = 'Cliente Fiel';
            }

            if (role) {
                // GUARDAMOS EL OBJETO COMPLETO PARA QUE EL INDEX.HTML LO LEA
                const sessionData = {
                    email: email,
                    role: role,
                    name: name,
                    loginTime: new Date().getTime()
                };
                
                localStorage.setItem('userPizzaApp', JSON.stringify(sessionData));
                redirigirPorRol(role);
            } else {
                errorDiv.textContent = 'Credenciales demo incorrectas. Prueba con admin@demo.com';
                errorDiv.style.display = 'block';
            }
        });

        // Función auxiliar de navegación
        function redirigirPorRol(role) {
            if (role === 'admin') {
                window.location.href = 'panelA.html';
            } else if (role === 'vendor') {
                window.location.href = 'panel_empleado.html';
            } else {
                window.location.href = 'index.html'; // El cliente vuelve al catálogo ya logueado
            }
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            const button = input.nextElementSibling; 
            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈"; 
            } else {
                input.type = "password";
                button.textContent = "👁️"; 
            }
        }

        // Simulación de Google Login para que también guarde sesión
        function handleCredentialResponse(response) {
            const googleUser = {
                email: "google-user@demo.com",
                role: 'client',
                name: 'Usuario de Google',
                loginTime: new Date().getTime()
            };
            localStorage.setItem('userPizzaApp', JSON.stringify(googleUser));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
