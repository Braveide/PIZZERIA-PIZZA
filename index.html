<script>
    // --- ESTE ES EL BLOQUE DE AUTENTICACIÓN DEFINITIVO ---
    async function initAuth() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const userBtn = document.getElementById('userBtn');
        const userDropdown = document.getElementById('userDropdown');

        if (user) {
            // Extraemos nombre, rol y avatar de tu tabla 'perfiles'
            const { data: perfil } = await supabaseClient
                .from('perfiles')
                .select('rol, nombre, avatar_url')
                .eq('id', user.id)
                .maybeSingle();

            const rol = perfil ? perfil.rol : 'usuario';
            const nombre = perfil && perfil.nombre ? perfil.nombre : 'Usuario';
            const fotoUrl = perfil && perfil.avatar_url ? perfil.avatar_url : 'imagenes/freddy.png';
            
            // 1. CAMBIO: Foto en el botón circular (Header) - Igual que en tu imagen 3
            userBtn.innerHTML = `<img src="${fotoUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            
            userBtn.onclick = (e) => { 
                e.stopPropagation();
                userDropdown.classList.toggle('active'); 
            };

            // 2. CAMBIO: Info dentro del Dropdown (Foto, Nombre real y Email)
            const userInfoBox = document.getElementById('userInfo');
            userInfoBox.innerHTML = `
                <img src="${fotoUrl}" style="width:70px; height:70px; border-radius:50%; border:3px solid #000; margin-bottom:10px; object-fit:cover;">
                <div style="font-family:'Archivo Black', sans-serif; font-size:16px; color:#000;">${nombre}</div>
                <div style="font-size:11px; color:#666; margin-bottom:5px;">${user.email}</div>
                <p class="user-role-badge" style="color:#ff4500; font-weight:900;">${rol.toUpperCase()}</p>
            `;
            
            // 3. LOGICA PANEL ADMIN
            const adminContainer = document.getElementById('adminLinkContainer');
            if (rol === 'admin') {
                adminContainer.innerHTML = `
                    <a href="panelA.html" class="profile-menu-link admin-link" style="background:#000; color:#fff;">⚙️ PANEL ADMIN</a>
                `;
            } else {
                adminContainer.innerHTML = '';
            }

            // 4. CAMBIO: Borrar "Mis Pedidos" y corregir link a "perfil.html"
            // Buscamos el contenedor de enlaces y lo limpiamos
            const dropdownLinks = `
                <a href="perfil.html" class="profile-menu-link">👤 Mi Perfil</a>
                <button onclick="cerrarSesion()" class="logout-btn">CERRAR SESIÓN</button>
            `;
            
            // Eliminamos cualquier botón viejo de pedidos que ande por ahí
            const linksContainer = document.querySelector('#userDropdown');
            // Quitamos links viejos para no duplicar
            const existingLinks = linksContainer.querySelectorAll('.profile-menu-link:not(.admin-link), .logout-btn');
            existingLinks.forEach(el => el.remove());
            
            linksContainer.insertAdjacentHTML('beforeend', dropdownLinks);

        } else {
            // Si no hay usuario, mandamos al login
            userBtn.onclick = () => window.location.href = 'login.html';
        }
    }
</script>
