<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Freddy's Pizza</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; }

        /* Botón flotante de la pizza */
        .pizza-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ff6600;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .pizza-button img { width: 35px; }

        /* Ventana del Chat */
        .chat-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 300px;
            height: 400px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            border: 1px solid #ddd;
        }

        .chat-header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 80%;
            font-size: 14px;
        }

        .bot-message {
            background-color: #eee;
            align-self: flex-start;
        }

        .user-message {
            background-color: #ff6600;
            color: white;
            align-self: flex-end;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #eee;
        }

        .chat-input input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 8px 12px;
            outline: none;
        }

        .chat-input button {
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="pizza-button" onclick="toggleChat()">
        <img src="https://cdn-icons-png.flaticon.com/512/1404/1404945.png" alt="Pizza">
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">Freddy's Assistant</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">¡Hola! Soy Fazbot. ¿En qué puedo ayudarte hoy?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Escribe un mensaje...">
            <button onclick="sendMessage()">></button>
        </div>
    </div>

    <script>
        function toggleChat() {
            const chat = document.getElementById('chatWindow');
            chat.style.display = chat.style.display === 'none' || chat.style.display === '' ? 'flex' : 'none';
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatMessages');
            const text = input.value.trim();

            if (text !== "") {
                // Mensaje del usuario
                const userDiv = document.createElement('div');
                userDiv.className = 'message user-message';
                userDiv.textContent = text;
                container.appendChild(userDiv);

                input.value = "";

                // Respuesta del Bot (Lógica simple)
                setTimeout(() => {
                    const botDiv = document.createElement('div');
                    botDiv.className = 'message bot-message';
                    
                    if (text.toLowerCase().includes("hola")) {
                        botDiv.textContent = "¡Hola, bienvenido a Freddy's! ¿Quieres ver el menú?";
                    } else if (text.toLowerCase().includes("pizza")) {
                        botDiv.textContent = "Tenemos Pepperoni, Hawaiana y Suprema. ¿Cuál te gusta?";
                    } else {
                        botDiv.textContent = "¡Qué interesante! ¿Te gustaría ordenar algo ahora?";
                    }

                    container.appendChild(botDiv);
                    container.scrollTop = container.scrollHeight;
                }, 600);
            }
        }
    </script>
</body>
</html>
