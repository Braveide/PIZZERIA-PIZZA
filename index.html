<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos rápidos para asegurar que el botón se vea y el chat funcione */
        body { font-family: sans-serif; background: #fdf2e9; margin: 0; }
        #chat-trigger { 
            position: fixed; bottom: 20px; right: 20px; background: #ff6b00; 
            border: 4px solid #000; width: 70px; height: 70px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 35px; cursor: pointer; z-index: 10001; box-shadow: 6px 6px 0px #000;
        }
        #chat-window { 
            display: none; position: fixed; bottom: 100px; right: 20px; width: 320px; height: 450px; 
            background: #fff; border: 4px solid #000; border-radius: 20px; flex-direction: column; 
            z-index: 10000; box-shadow: 10px 10px 0px rgba(0,0,0,0.2); overflow: hidden;
        }
        .chat-header { background: #000; color: #fff; padding: 10px; font-family: 'Archivo Black'; display: flex; justify-content: space-between; }
        #chat-messages { flex-grow: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #f9f9f9; }
        .msg { padding: 8px 12px; border-radius: 12px; border: 2px solid #000; max-width: 80%; font-size: 14px; }
        .bot { background: #fff; align-self: flex-start; }
        .user { background: #ff6b00; color: #fff; align-self: flex-end; }
        .music-btn { background: #ffeb3b; border: 2px solid #000; padding: 5px; cursor: pointer; font-weight: bold; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="imagenes/cancion.mp3" type="audio/mpeg">
    </audio>

    <div id="chat-trigger">🍕</div>

    <div id="chat-window">
        <div class="chat-header"><span>FREDDY BOT</span><span id="close-chat" style="cursor:pointer">X</span></div>
        <div id="music-btn" class="music-btn">🎵 CLIC AQUÍ PARA LA MÚSICA 🎵</div>
        <div id="chat-messages"></div>
        <div style="padding:10px; border-top:2px solid #000; display:flex;">
            <input type="text" id="chat-input" style="flex:1; padding:8px;" placeholder="Dime algo...">
            <button id="send-btn" style="background:#ff6b00; border:2px solid #000; margin-left:5px; cursor:pointer;">></button>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://vndfmcxlifcwzpjbphoy.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuZGZtY3hsaWZjd3pwamJwaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTc3MDIsImV4cCI6MjA4NzM3MzcwMn0.OkQ6aSZsHkyLMgfT-x0w3beJ3Ey95smEujmhT7ZfjuY');

        const chistes = [
            "¿Por qué la pizza lloraba? Porque tenía mucha masa emocional. 😂",
            "¿Qué le dice una pizza a otra? '¡Qué buena masa tienes!' 🍕",
            "Soy un robot, pero mi corazón es de pepperoni. Pregúntame por el menú.",
            "No entendí eso, pero... ¿sabías que la pizza redonda viene en caja cuadrada y se come en triángulos? ¡Es magia! ✨",
            "Mi vocabulario es limitado, pero mi hambre es infinita. ¡Pide una pizza!"
        ];

        document.getElementById('chat-trigger').onclick = () => {
            document.getElementById('chat-window').style.display = 'flex';
            if(document.getElementById('chat-messages').innerHTML === "") {
                addBotMsg("¡Hola! Soy Freddy. Escribe 'menu' para ver qué tenemos hoy.");
            }
        };

        document.getElementById('close-chat').onclick = () => document.getElementById('chat-window').style.display = 'none';

        document.getElementById('music-btn').onclick = function() {
            const audio = document.getElementById('bgMusic');
            audio.play();
            this.innerHTML = "🔊 MÚSICA ACTIVA";
            this.style.background = "#8bc34a";
        };

        async function handleChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.toLowerCase().trim();
            if(!text) return;

            addUserMsg(input.value);
            input.value = '';

            // LÓGICA DE RESPUESTAS
            if(text.includes("menu") || text.includes("pizza") || text.includes("bebida") || text.includes("tienen")) {
                const { data, error } = await supabaseClient.from('productos').select('nombre, precio');
                if(error) {
                    addBotMsg("¡Ups! Mi conexión con la cocina falló (revisa si tu Supabase está pausado).");
                } else {
                    let lista = data.map(p => `• ${p.nombre} ($${p.precio})`).join('<br>');
                    addBotMsg(`**Esto tenemos para ti:**<br>${lista}`);
                }
            } 
            else if(text.includes("hola")) {
                addBotMsg("¡Hola! ¿Buscas pizza o solo vienes a saludar?");
            }
            else {
                // RESPUESTA ALEATORIA CUANDO NO ENTIENDE
                const chisteAzar = chistes[Math.floor(Math.random() * chistes.length)];
                addBotMsg(chisteAzar);
            }
        }

        function addBotMsg(t) {
            const d = document.createElement('div'); d.className = 'msg bot'; d.innerHTML = t;
            document.getElementById('chat-messages').appendChild(d);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        function addUserMsg(t) {
            const d = document.createElement('div'); d.className = 'msg user'; d.textContent = t;
            document.getElementById('chat-messages').appendChild(d);
            document.getElementById('chat-messages').scrollTop = 9999;
        }

        document.getElementById('send-btn').onclick = handleChat;
        document.getElementById('chat-input').onkeypress = (e) => { if(e.key==='Enter') handleChat(); };
    </script>
</body>
</html>
