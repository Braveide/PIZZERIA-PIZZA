<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Iniciar Sesión</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* ESTILOS LIMPIOS Y CON MARCO */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #ffffff; /* Fondo totalmente blanco */
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }

        /* CONTENEDOR CON MARCO NEGRO SÓLIDO */
        .container { 
            background: white; 
            border: 4px solid #000000; /* El marco negro que pediste */
            border-radius: 20px; 
            max-width: 450px; 
            width: 100%; 
            padding: 40px 30px; 
            text-align: center; 
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.05); /* Sombra sutil */
        }
        
        .logo-container { 
            width: 110px; 
            height: 110px; 
            margin: 0 auto 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 { font-size: 28px; color: #333; margin-bottom: 10px; font-weight: 600; }
        .subtitle { color: #666; font-size: 16px; margin-bottom: 30px; }
        
        /* PESTAÑAS CON BORDE */
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab { 
            flex: 1; 
            padding: 12px; 
            background: #f5f5f5; 
            border: 2px solid #000; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #666; 
        }
        .tab.active { background: #e8e8e8; color: #000; border-color: #000; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; font-size: 14px; }
        
        .input-wrapper { 
            display: flex; 
            align-items: center; 
            background: #fff; 
            border: 2px solid #000; 
            border-radius: 10px; 
            padding: 0 15px; 
        }
        .form-group input { width: 100%; padding: 12px 0; border: none; outline: none; font-size: 15px; }

        /* BOTÓN NARANJA CON BORDE NEGRO */
        .btn-submit { 
            width: 100%; 
            padding: 16px; 
            background: #ff6b00; 
            color: white; 
            border: 3px solid #000; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
            transition: 0.2s;
        }
        .btn-submit:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

        .back-link { display: inline-block; margin-top: 20px; color: #ff6b00; text-decoration: none; font-weight: bold; font-size: 14px; }
        .separator { display: flex; align-items: center; text-align: center; margin: 25px 0 15px; font-weight: bold; }
        .separator::before, .separator::after { content: ''; flex: 1; border-bottom: 2px solid #000; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="imagenes/logotipo.png" alt="Freddy's Pizza Logo">
        </div>
        
        <h1>Freddy´s Pizza</h1>
        <p class="subtitle">¡Bienvenido!</p>
    
        <div id="errorMessage"></div>

        <div class="tabs">
            <button class="tab active">Iniciar Sesión</button>
            <a href="registro.html" style="flex: 1; text-decoration: none;">
                <button type="button" class="tab" style="width: 100%;">Registrarse</button>
            </a>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuario (Email Demo)</label>
                <div class="input-wrapper">
                    <input type="text" id="usernameInput" placeholder="Ingresa Tu Correo" required>
                </div>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordInput" placeholder="Ingresa Tu Contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Entrar Ahora</button>
        </form>

        <div class="separator">o</div>
        
        <div id="g_id_onload" data-client_id="304677210854-6t97pu7evthct109hqvs80b4ejmuavtq.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
        <div class="g_id_signin" data-type="standard" style="display: flex; justify-content: center;"></div>

        <a href="index.html" class="back-link">← Volver al Catálogo</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('usernameInput').value.trim();
            if (email === 'admin@demo.com') window.location.href = 'panelA.html';
            else if (email === 'vendor@demo.com') window.location.href = 'panel_empleado.html';
            else window.location.href = 'index.html';
        });

        function handleCredentialResponse(response) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
