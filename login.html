<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDDY'S PIZZA - Iniciar Sesión</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* --- ESTILOS ORIGINALES DE TU ARCHIVO --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:#ff6b00;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ff6b00 0%, #ff3d00 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 61, 0, 0.3);
        }

        .logo img {
            width: 50%; 
            height: 50%;
            object-fit: contain;
        }
        
        .logo:empty::before {
            content: "🍕";
            font-size: 40px;
            line-height: 100px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: #f5f5f5;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
        }

        .tab.active {
            background: #e8e8e8;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 0 15px;
        }

        .input-icon {
            color: #999;
            margin-right: 10px;
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            color: #333;
            outline: none;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .toggle-password {
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 18px;
            padding: 5px;
            user-select: none; 
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff6b00 0%, #ff3d00 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 61, 0, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ff6b00; 
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #ff3d00; 
        }
        
        #errorMessage {
            color: #e3342f; 
            background-color: #fcebeb; 
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 14px; 
            font-weight: 500; 
            display: none; 
            border: 1px solid #e3342f;
        }

        /* Separador y contenedor del botón de Google */
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0 15px;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .separator:not(:empty)::before {
            margin-right: .25em;
        }

        .separator:not(:empty)::after {
            margin-left: .25em;
        }
    </style>
</head>
<body>
    <div class="container">
    
        <div class="logo">
            </div>

        <h1>Freddy´s Pizza</h1>
        <p class="subtitle">¡Bienvenido!</p>
    
        <div id="errorMessage"></div>

        <div class="tabs">
            <button class="tab active">Iniciar Sesión</button>
            <a href="registro.html" style="flex: 1; text-decoration: none;">
                <button type="button" class="tab" style="width: 100%;">Registrarse</button>
            </a>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="usernameInput">Usuario (Email Demo)</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="usernameInput" placeholder="admin@demo.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="passwordInput">Contraseña</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="passwordInput" placeholder="Cualquier contraseña" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('passwordInput')">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="separator">o</div>
        
        <div id="g_id_onload"
             data-client_id="304677210854-6t97pu7evthct109hqvs80b4ejmuavtq.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left"
             style="width: 100%; display: flex; justify-content: center;">
        </div>

        <a href="index.html" class="back-link">← Volver al Catálogo</a>
    </div>

    <script>
        // --- LÓGICA DE LOGIN DEMO ---
        document.getElementById('adminLoginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';

            let role = null;

            // Validación de credenciales demo
            if (email === 'admin@demo.com') {
                role = 'admin';
            } else if (email === 'vendor@demo.com') {
                role = 'vendor';
            } else if (email === 'cliente@demo.com') {
                role = 'client';
            }

            if (role) {
                // Guardar sesión en localStorage
                localStorage.setItem('userPizzaApp', JSON.stringify({
                    email: email,
                    role: role,
                    name: 'Usuario Demo'
                }));

                // Redirección basada en rol
                if (role === 'admin') {
                    window.location.href = 'panelA.html';
                } else if (role === 'vendor') {
                    window.location.href = 'panel-vendedor.html'; // Asegúrate de crear este archivo
                } else {
                    window.location.href = 'menu_cliente.html';
                }
            } else {
                errorDiv.textContent = 'Correo electrónico demo incorrecto.';
                errorDiv.style.display = 'block';
            }
        });

        // Función original para mostrar/ocultar contraseña
        function togglePassword(id) {
            const input = document.getElementById(id);
            const button = input.nextElementSibling; 

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈"; 
            } else {
                input.type = "password";
                button.textContent = "👁️"; 
            }
        }

        // --- LÓGICA DE GOOGLE (Original de tu archivo) ---
        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            localStorage.setItem('userPizzaApp', JSON.stringify({
                name: responsePayload.name,
                email: responsePayload.email,
                role: 'client',
                picture: responsePayload.picture
            }));
            window.location.href = 'menu_cliente.html';
        }

        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
